<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel SGS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EEF1FA;
    --panel: #FFFFFF;
    --panel-border: #E7EAF6;
    --text: #1B1F2E;
    --muted: #7B84A3;
    --headbar: #2E3178;
    --headbar-soft: #3B3F94;
    --headbar-text: #F1F2F5;
    --accent: #F95F45;
    --accent-soft: #FFEDE8;
    --blue-soft: #EDF0FE;

    --amber-bg: #FDF1DE; --amber-text: #9A6A0E; --amber-solid: #E3A020;
    --red-bg: #FCE7E5;   --red-text: #C23A2C;   --red-solid: #EF5B48;
    --maroon-bg: #F5E3EA; --maroon-text: #8C3252; --maroon-solid: #B14A6E;
    --green-bg: #E4F6EC; --green-text: #1F8556;   --green-solid: #34B978;
    --gray-bg: #EEF0F8;  --gray-text: #6B7290;    --gray-solid: #9AA1C2;

    --r-lg: 24px; --r-md: 18px; --r-sm: 13px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{background:var(--bg); color:var(--text); font-family:'Inter',system-ui,sans-serif; min-height:100vh;}
  ::selection{background:var(--accent); color:#fff;}

  .app-shell{display:flex; min-height:100vh;}

  /* ---------- barra lateral ---------- */
  .sidebar{
    width:250px; flex:none;
    background:linear-gradient(190deg, var(--headbar-soft) 0%, var(--headbar) 55%);
    color:#fff; display:flex; flex-direction:column;
    transition:width .18s ease, padding .18s ease;
    overflow:hidden; position:relative;
  }
  .sidebar.collapsed{width:0; padding:0;}
  .sidebar-top{
    display:flex; align-items:center; justify-content:space-between;
    padding:26px 20px 18px;
  }
  .sidebar-top .stitle{font-family:'Big Shoulders Display',sans-serif; font-weight:800; letter-spacing:1px; font-size:19px; white-space:nowrap; display:flex; align-items:center; gap:10px;}
  .stitle-logo{width:26px; height:auto; flex:none; display:block;}
  .sidebar-toggle{
    background:rgba(255,255,255,.1); border:none; color:#fff;
    width:30px; height:30px; border-radius:10px; cursor:pointer; flex:none;
    font-size:14px; display:flex; align-items:center; justify-content:center;
  }
  .sidebar-toggle:hover{background:rgba(255,255,255,.2);}
  .sidebar-nav{display:flex; flex-direction:column; padding:10px 14px; gap:6px;}
  .sidebar-nav a{
    display:flex; align-items:center; gap:12px;
    color:#C7CAE8; text-decoration:none; font-size:14px; font-weight:600;
    padding:12px 16px; border-radius:999px; white-space:nowrap;
    transition:.15s;
  }
  .sidebar-nav a .nav-label{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis;}
  .sidebar-nav a:hover{background:rgba(255,255,255,.08); color:#fff;}
  .sidebar-nav a.active{
    background:#fff; color:var(--headbar);
    box-shadow:0 8px 20px rgba(15,17,50,.28);
    font-weight:700;
  }
  .sidebar-nav .navdot{
    width:9px; height:9px; border-radius:50%; flex:none;
    background:var(--accent); box-shadow:0 0 0 3px rgba(249,95,69,.18);
  }
  .sidebar-nav a.active .navdot{background:var(--headbar); box-shadow:none;}
  .sidebar-nav .divider{height:1px; background:rgba(255,255,255,.12); margin:12px 14px;}
  .nav-badge{
    flex:none; min-width:22px; text-align:center; padding:2px 7px;
    border-radius:999px; font-size:11px; font-weight:700;
    background:rgba(255,255,255,.14); color:#C7CAE8;
  }
  .sidebar-nav a.active .nav-badge{background:var(--gray-bg); color:var(--muted);}
  .nav-badge.nav-badge-alert{background:var(--accent); color:#fff;}
  .sidebar-nav a.active .nav-badge.nav-badge-alert{background:var(--accent); color:#fff;}

  .sidebar-deco{
    margin-top:auto; padding:26px 22px 30px; opacity:.9;
  }

  .content-shell{flex:1; min-width:0; display:flex; flex-direction:column;}
  .sidebar-open-btn{
    position:fixed; top:18px; left:18px; z-index:40;
    width:38px; height:38px; border-radius:12px; border:none;
    background:var(--headbar); color:#fff; cursor:pointer; font-size:15px;
    display:none; align-items:center; justify-content:center;
    box-shadow:0 6px 16px rgba(46,49,120,.28);
  }
  .sidebar-open-btn.show{display:flex;}

  /* ---------- topo ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: clamp(20px,2.6vh,30px) clamp(24px,3vw,48px) clamp(10px,1.4vh,16px);
    background:var(--bg);
  }
  .brand{display:flex; align-items:baseline; gap:14px;}
  .brand .dot{width:11px;height:11px;border-radius:50%; background:var(--accent); display:inline-block; box-shadow:0 0 0 4px var(--accent-soft);}
  .brand h1{font-family:'Big Shoulders Display',sans-serif; font-weight:800; letter-spacing:.4px; font-size:clamp(24px,2.8vw,34px); margin:0; color:var(--headbar);}
  .brand span.sub{color:var(--muted); font-size:clamp(11px,.95vw,13px); letter-spacing:.3px;}
  .meta{display:flex; align-items:center; gap:clamp(12px,2vw,22px); font-family:'JetBrains Mono',monospace;}
  .meta .clock{
    font-size:clamp(14px,1.5vw,18px); font-weight:700; color:var(--headbar);
    background:#fff; padding:9px 16px; border-radius:999px;
    box-shadow: 0 2px 10px rgba(46,49,120,.08); border:1px solid var(--panel-border);
  }
  .meta .updated{font-size:clamp(10px,.85vw,12px); color:var(--muted); text-align:right;}
  .meta .updated b{color:var(--headbar); font-weight:700;}

  /* ---------- barra de filtros ---------- */
  .filterbar{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding: 6px clamp(24px,3vw,48px) 20px;
    background:var(--bg);
  }
  .filterbar .flabel{font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color:var(--muted); margin-right:2px; font-weight:700;}
  .seg{display:flex; gap:6px; background:#fff; padding:4px; border-radius:999px; box-shadow:0 2px 10px rgba(46,49,120,.06); border:1px solid var(--panel-border);}
  .seg button{
    font-family:'Inter',sans-serif; font-size:13px; font-weight:600;
    padding:8px 15px; border-radius:999px; border:none;
    background:transparent; color:var(--muted); cursor:pointer; transition:.15s;
  }
  .seg button:hover{color:var(--text);}
  .seg button.active{background:var(--headbar); color:#fff;}

  .wa-btn{
    font-family:'Inter',sans-serif; font-size:13px; font-weight:700;
    padding:10px 18px; border-radius:999px; border:none; cursor:pointer;
    background:#25D366; color:#fff; transition:.15s; box-shadow:0 4px 12px rgba(37,211,102,.3);
  }
  .wa-btn:hover{filter:brightness(0.97); transform:translateY(-1px);}
  .wa-contact{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 16px; border:1px solid var(--panel-border); border-radius:var(--r-sm);
    margin-bottom:8px; cursor:pointer; transition:.15s;
  }
  .wa-contact:hover{border-color:#25D366; background:#F3FBF6; transform:translateX(2px);}
  .wa-contact .wa-name{font-weight:700; font-size:14px; color:var(--text);}
  .wa-contact .wa-phone{font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--muted); margin-top:2px;}
  .wa-contact .wa-send{color:#25D366; font-size:20px;}
  .wa-empty{color:var(--muted); font-size:13.5px; line-height:1.6;}

  .marks-row{display:flex; gap:6px; margin-top:6px; flex-wrap:wrap;}
  .mark-tag{font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:999px; display:inline-block;}
  .mark-tag.mark-done{background:var(--green-bg); color:var(--green-text);}
  .mark-tag.mark-pass{background:var(--gray-bg); color:var(--gray-text);}
  .item.item-done{opacity:.62;}

  .track-box{border-top:1px solid var(--panel-border); padding-top:16px; margin-top:4px;}
  .track-box .k{font-size:10.5px; text-transform:uppercase; letter-spacing:1.3px; color:var(--muted); margin-bottom:10px; font-weight:700;}
  .track-check{display:flex; align-items:center; gap:9px; font-size:14px; font-weight:600; margin-bottom:12px; cursor:pointer;}
  .track-check input{width:17px; height:17px; cursor:pointer;}
  .track-input{
    width:100%; padding:11px 14px; border:1px solid var(--panel-border); border-radius:var(--r-sm);
    font-size:13.5px; font-family:'Inter',sans-serif; margin-bottom:12px; background:var(--gray-bg);
  }
  .track-save{
    background:var(--accent); color:#fff; border:none; padding:10px 20px;
    border-radius:999px; font-weight:700; font-size:13px; cursor:pointer;
    box-shadow:0 4px 12px rgba(249,95,69,.3);
  }
  .track-save:hover{filter:brightness(0.97);}
  .track-note{font-size:11px; color:var(--muted); margin-top:10px; line-height:1.5;}

  .checklist{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .check-item{
    display:flex; align-items:center; gap:8px;
    font-size:13px; font-weight:600; color:var(--gray-text);
    background:#fff; border:1px solid var(--panel-border);
    padding:7px 15px 7px 10px; border-radius:999px;
  }
  .check-item .check-icon{
    width:18px; height:18px; border-radius:50%; flex:none;
    display:flex; align-items:center; justify-content:center;
    border:1.5px solid #C6CBE0; background:#fff; font-size:11px; color:#fff;
  }
  .check-item.done{color:var(--green-text); background:var(--green-bg); border-color:transparent;}
  .check-item.done .check-icon{background:var(--green-solid); border-color:var(--green-solid);}

  /* ---------- grade de cards ---------- */
  main{padding: clamp(10px,1.4vh,18px) clamp(24px,3vw,48px) clamp(24px,3vh,40px);}
  .grid{display:flex; flex-wrap:wrap; align-items:flex-start; gap: clamp(16px,1.8vw,22px);}
  .card{
    background:var(--panel); border:1px solid var(--panel-border); border-radius:var(--r-lg);
    padding:clamp(18px,1.9vw,24px); position:relative; overflow:hidden;
    display:flex; flex-direction:column; gap:14px;
    box-shadow: 0 6px 24px rgba(46,49,120,.06);
    flex:1 1 340px; min-width:340px; max-width:100%;
    transition: flex-basis .18s ease, min-width .18s ease, max-width .18s ease, box-shadow .15s;
  }
  .card:hover{box-shadow: 0 10px 30px rgba(46,49,120,.1);}
  .card.collapsed-h{flex:0 0 128px; min-width:128px; max-width:128px; padding:16px 14px;}
  .card.collapsed-h .card-body{display:none;}
  .card.collapsed-h .card-head{flex-direction:column; align-items:flex-start; gap:10px;}
  .card.dragging{opacity:.4;}
  .card.sortable-ghost{opacity:.25;}
  .card::before{content:""; position:absolute; left:14px; top:14px; width:6px; height:6px; border-radius:50%; background:var(--sev-solid, var(--gray-solid)); display:none;}
  .card-head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .card-head h2{font-family:'Big Shoulders Display',sans-serif; font-weight:800; text-transform:uppercase; font-size:clamp(18px,1.7vw,23px); margin:0; letter-spacing:.2px; line-height:1.05; color:var(--headbar);}
  .card-head-right{display:flex; align-items:center; gap:6px; flex:none;}
  .card-toggle{
    background:var(--gray-bg); border:none; width:28px; height:28px; border-radius:999px;
    cursor:pointer; font-size:13px; color:var(--muted);
    display:flex; align-items:center; justify-content:center;
    transition:transform .15s, background .12s; flex:none;
  }
  .card-toggle:hover{background:var(--blue-soft); color:var(--headbar);}
  .card.collapsed .card-toggle{transform:rotate(-90deg);}
  .card.collapsed .card-body{display:none;}
  .card-toggle-h{
    background:var(--gray-bg); border:none; width:28px; height:28px; border-radius:999px;
    cursor:pointer; font-size:13px; color:var(--muted);
    display:flex; align-items:center; justify-content:center;
    transition:transform .15s, background .12s; flex:none;
  }
  .card-toggle-h:hover{background:var(--blue-soft); color:var(--headbar);}
  .card.collapsed-h .card-toggle-h{transform:rotate(180deg);}
  .drag-handle{
    cursor:grab; color:var(--muted); font-size:16px; padding:2px 4px; flex:none;
    display:flex; align-items:center; justify-content:center; user-select:none;
  }
  .drag-handle:active{cursor:grabbing;}
  .drag-handle:hover{color:var(--headbar);}
  .led{
    display:flex; align-items:center; gap:6px;
    font-family:'JetBrains Mono',monospace; font-size:10.5px; font-weight:700;
    text-transform:uppercase; letter-spacing:.5px; white-space:nowrap;
    padding:6px 12px; border-radius:999px;
    background:var(--sev-bg, var(--gray-bg)); color:var(--sev-text, var(--gray-text));
  }
  .led .bulb{width:7px;height:7px;border-radius:50%; background:var(--sev-solid, var(--gray-solid));}

  .total-row{display:flex; align-items:baseline; gap:10px;}
  .total-row .num{font-family:'Big Shoulders Display',sans-serif; font-weight:800; font-size:clamp(34px,3.3vw,44px); line-height:1; color:var(--headbar);}
  .total-row .lbl{color:var(--muted); font-size:11.5px; text-transform:uppercase; letter-spacing:1.4px; font-weight:600;}

  .badges{display:flex; flex-wrap:wrap; gap:8px;}
  .badge{
    display:flex; align-items:center; gap:6px; padding:7px 13px; border-radius:999px;
    font-size:12.5px; font-weight:700; cursor:pointer; border:1.5px solid transparent;
    background:var(--b-bg); color:var(--b-text); transition:.15s;
  }
  .badge:hover{filter:brightness(0.97); transform:translateY(-1px);}
  .badge.active{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent);}
  .badge .n{font-family:'JetBrains Mono',monospace;}

  .listwrap{border-top:1px solid var(--panel-border); padding-top:12px;}
  .list-title{font-size:10.5px; text-transform:uppercase; letter-spacing:1.4px; color:var(--muted); margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; font-weight:700;}
  .list-title .clear{cursor:pointer; color:var(--accent); text-transform:none; letter-spacing:0; font-weight:700;}
  .list{
    display:flex; flex-direction:column; gap:10px; max-height:400px; overflow-y:auto;
    padding:2px 4px 2px 22px; position:relative;
  }
  .list::before{
    content:""; position:absolute; left:9px; top:6px; bottom:6px; width:2px;
    background:var(--panel-border); border-radius:2px;
  }
  .item{
    position:relative;
    display:flex; align-items:center; gap:10px; font-size:12.5px;
    background:var(--i-bg, var(--gray-bg));
    border-radius:var(--r-sm); padding:10px 12px; cursor:pointer; transition:.15s;
  }
  .item::before{
    content:""; position:absolute; left:-17px; top:50%; transform:translateY(-50%);
    width:10px; height:10px; border-radius:50%;
    background:var(--i-dot, var(--gray-solid));
    box-shadow:0 0 0 3px var(--panel);
  }
  .item:hover{transform:translateX(3px); box-shadow:0 4px 14px rgba(46,49,120,.08);}
  .item .procwrap{flex:1; min-width:0;}
  .item .proc{font-family:'JetBrains Mono',monospace; font-weight:700; color:#161A28; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .item .sub{color:var(--muted); font-size:11px; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .item .prazo-tag{color:var(--accent); font-size:11px; font-weight:700; display:block; margin-top:1px;}
  .item .st{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.3px; padding:5px 10px; border-radius:999px; white-space:nowrap; background:#fff;}
  .ok-msg{display:flex; align-items:center; gap:8px; color:var(--green-text); font-weight:700; font-size:13.5px;}
  .err-msg{color:var(--red-text); font-size:13px;}
  .empty-sector{color:var(--muted); font-size:13px;}

  .empty{text-align:center; padding: 10vh 20px; color:var(--muted);}
  .empty h3{color:var(--headbar); font-family:'Big Shoulders Display',sans-serif; font-size:26px; text-transform:uppercase; margin-bottom:8px;}
  .empty p{max-width:520px; margin:0 auto; line-height:1.6;}
  .empty code{background:var(--gray-bg); padding:2px 6px; border-radius:5px; font-size:12px;}

  /* ---------- página de setor ---------- */
  .sector-header{
    background:linear-gradient(120deg, var(--headbar) 0%, var(--headbar-soft) 100%);
    border-radius:var(--r-lg);
    padding:clamp(20px,2.4vw,30px); margin-bottom:clamp(16px,1.8vw,22px);
    box-shadow: 0 10px 30px rgba(46,49,120,.18);
    position:relative; overflow:hidden; color:#fff;
  }
  .sector-header::before{content:""; position:absolute; right:-40px; top:-40px; width:180px; height:180px; border-radius:50%; background:rgba(249,95,69,.16);}
  .sector-header h2{font-family:'Big Shoulders Display',sans-serif; font-weight:800; text-transform:uppercase; font-size:clamp(28px,3.1vw,40px); margin:0 0 14px; color:#fff; position:relative;}
  .sector-header .total-row .num{color:#fff;}
  .sector-header .total-row .lbl{color:#C7CAE8;}
  .sector-header .led{background:rgba(255,255,255,.14); color:#fff;}
  .sector-header .led .bulb{background:var(--accent);}
  .sector-header .badge{background:rgba(255,255,255,.14) !important; color:#fff !important;}
  .sector-header .badge.active{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent);}
  .sector-layout{display:grid; grid-template-columns:minmax(280px,1fr) minmax(280px,1.4fr); gap:clamp(16px,1.8vw,22px); align-items:start;}
  @media (max-width: 860px){ .sector-layout{grid-template-columns:1fr;} }

  .chart-card{
    background:var(--panel); border:1px solid var(--panel-border); border-radius:var(--r-lg);
    padding:clamp(18px,1.9vw,24px);
    box-shadow: 0 6px 24px rgba(46,49,120,.06);
  }
  .chart-title{font-size:11px; text-transform:uppercase; letter-spacing:1.4px; color:var(--muted); margin-bottom:16px; font-weight:700;}
  .chart-row{display:flex; align-items:center; gap:10px; cursor:pointer; padding:6px 8px; margin:0 -8px 8px; border-radius:var(--r-sm); transition:.15s;}
  .chart-row:hover{background:var(--gray-bg);}
  .chart-row.active{background:var(--blue-soft);}
  .chart-row.active .chart-label{color:var(--headbar);}
  .chart-row.active .chart-bar{background:var(--accent);}
  .chart-row .chart-label{width:38%; font-size:12.5px; color:var(--text); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .chart-bar-wrap{flex:1; background:var(--gray-bg); border-radius:8px; height:14px; overflow:hidden;}
  .chart-bar{height:100%; background:var(--headbar); border-radius:8px; transition:width .3s;}
  .chart-value{width:28px; text-align:right; font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--muted); font-weight:600;}

  .sector-list .list{max-height:560px;}

  footer.tvfoot{text-align:center; color:var(--muted); font-size:11px; padding:16px; letter-spacing:.4px;}
  .list::-webkit-scrollbar{width:6px;}
  .list::-webkit-scrollbar-thumb{background:#D2D7E9; border-radius:6px;}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,22,45,.55);
    backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center;
    z-index:100; padding:20px;
  }
  .modal-overlay.hidden{display:none;}
  .modal-box{
    background:#fff; border-radius:var(--r-lg); width:100%; max-width:480px;
    max-height:82vh; overflow-y:auto;
    box-shadow: 0 24px 60px rgba(20,22,45,.3);
  }
  .modal-head{
    background:linear-gradient(120deg, var(--headbar) 0%, var(--headbar-soft) 100%); color:#fff;
    padding:22px 26px; border-radius:var(--r-lg) var(--r-lg) 0 0;
    display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
    position:sticky; top:0;
  }
  .modal-head .proc{font-family:'JetBrains Mono',monospace; font-size:18px; font-weight:700;}
  .modal-head .sector{color:#C7CAE8; font-size:11px; text-transform:uppercase; letter-spacing:1.5px; margin-top:4px; font-weight:600;}
  .modal-close{background:none; border:none; color:#C7C9E0; font-size:22px; cursor:pointer; line-height:1;}
  .modal-close:hover{color:#fff;}
  .modal-body{padding:24px 26px;}
  .modal-status{display:inline-flex; align-items:center; padding:7px 15px; border-radius:999px; font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; margin-bottom:18px;}
  .modal-field{padding:13px 0; border-top:1px solid var(--panel-border);}
  .modal-field:first-of-type{border-top:none;}
  .modal-field .k{font-size:10.5px; text-transform:uppercase; letter-spacing:1.3px; color:var(--muted); margin-bottom:4px; font-weight:700;}
  .modal-field .v{font-size:14.5px; color:var(--text); line-height:1.5; white-space:pre-wrap;}
</style>
</head>
<body>

  <div class="app-shell">

  <script>
  // ============================================================
  // CONFIGURAÇÃO
  // ============================================================
  const SPREADSHEET_ID = "1CkRcn649mVP7POSoWzK8n_JiY_CKWN-IVyXBC_TOIZk";
  function csvUrl(gid){
    return `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${gid}`;
  }
  // A ordem aqui é a ordem FIXA em que os setores sempre aparecem.
  const SECTOR_SHEETS = {
    "Comunicação":      csvUrl(0),
    "Analise":          csvUrl(393471051),
    "Peças":            csvUrl(1322980367),
    "Juridico":         csvUrl(1980625187),
    "Regulação":        csvUrl(847417293),
    "Auditoria":        csvUrl(382210428),
    "Amparo Integral":  csvUrl(246111584),
    "Acompanhamento":   csvUrl(152769067)
  };

  const POLL_MS = 20000;

  // Nome exato da associação usada no filtro "Mobili" (deve bater com a
  // coluna Associação da planilha).
  const MOBILI_NAME = "Mobili";

  // Pessoas que podem receber a atualização por WhatsApp. Telefone no
  // formato DDI+DDD+número, só dígitos (ex: 55 11 91234-5678 vira
  // "5511912345678"). Adicione ou remova linhas à vontade.
 const CONTACTS = [
    { name: "LIDIANE", phone: "553181200249" },
    { name: "Gustavo Rocha", phone: "553184139245" },
    { name: "Guilherme Tavares", phone: "553195650704" },
    { name: "Juciele", phone: "553191906258" },
    { name: "Alesther", phone: "553182578326" },
    { name: "Cristiano", phone: "553188420088" },
    { name: "Emerson", phone: "553195985419" },
    { name: "Flávio", phone: "553187120280" },
    { name: "Guilherme Modesto", phone: "553191820595" },
    { name: "Harrison", phone: "553188670460" },
    { name: "Miriam", phone: "553189199335" },
    { name: "Rafaela", phone: "553191244768" },
    { name: "Samy", phone: "553192564369" },
    { name: "Saymom", phone: "553181119931" },
    { name: "Tiago", phone: "553183730810" },
    { name: "Victor", phone: "553193439777" },
    { name: "Mariana", phone: "553171003849" },
    { name: "Marcela", phone: "553195173014" }
];

  // Ordem de gravidade dos status conhecidos (o primeiro é o mais grave).
  // Qualquer status que não esteja nesta lista (ex: "No prazo") aparece
  // depois, na cor neutra/verde por padrão.
  const SEVERITY_ORDER = ["Expirado", "Crítico", "Alerta"];
  const STATUS_STYLES = {
    "Expirado": {bg:"var(--maroon-bg)", text:"var(--maroon-text)", solid:"var(--maroon-solid)"},
    "Crítico":  {bg:"var(--red-bg)",    text:"var(--red-text)",    solid:"var(--red-solid)"},
    "Alerta":   {bg:"var(--amber-bg)",  text:"var(--amber-text)",  solid:"var(--amber-solid)"},
    "No prazo": {bg:"var(--green-bg)",  text:"var(--green-text)",  solid:"var(--green-solid)"}
  };
  const DEFAULT_STYLE = {bg:"var(--gray-bg)", text:"var(--gray-text)", solid:"var(--gray-solid)"};
  const OK_STYLE = {bg:"var(--green-bg)", text:"var(--green-text)", solid:"var(--green-solid)"};
  // ============================================================

  let lastSummary = null;
  let assocFilter = 'all';               // 'all' | 'mobili' | 'others'
  const sectorStatusFilter = {};         // sector -> status string | null
  const sectorEtapaFilter = {};          // sector -> etapa string | null
  const collapsedSectors = {};           // sector -> bool (cards minimizados no painel geral)
  const collapsedHSectors = {};          // sector -> bool (cards estreitados na horizontal)

  // ---------- ordem dos cards (arrastar e soltar) ----------
  const ORDER_KEY = 'sgs_sector_order_v1';
  let sectorOrder = [];
  function loadSectorOrder(){
    try{
      const raw = localStorage.getItem(ORDER_KEY);
      if (raw) sectorOrder = JSON.parse(raw);
    }catch(e){ sectorOrder = []; }
  }
  function saveSectorOrder(){
    try{ localStorage.setItem(ORDER_KEY, JSON.stringify(sectorOrder)); }catch(e){}
  }
  function getOrderedSectors(){
    const allKeys = Object.keys(SECTOR_SHEETS);
    const known = sectorOrder.filter(s => allKeys.includes(s));
    const missing = allKeys.filter(s => !known.includes(s));
    return known.concat(missing);
  }
  let itemIdCounter = 0;
  let itemsById = {};                    // id -> {item, sector} para abrir o modal de detalhes

  // ---------- marcações dos gestores (feito / passado para) ----------
  // Guardadas no navegador (localStorage) e resetadas automaticamente
  // sempre que os dados da planilha mudam (ou seja, quando você lança
  // o próximo relatório).
  const MARKS_KEY = 'sgs_marks_v1';
  let marksStore = { signature: null, marks: {} };

  function loadMarks(){
    try{
      const raw = localStorage.getItem(MARKS_KEY);
      if (raw) marksStore = JSON.parse(raw);
    }catch(e){ marksStore = { signature: null, marks: {} }; }
  }
  function saveMarks(){
    try{ localStorage.setItem(MARKS_KEY, JSON.stringify(marksStore)); }catch(e){}
  }
  function computeDataSignature(summary){
    const parts = [];
    Object.entries(summary.sectors).forEach(([sector, data]) => {
      if (data.error) return;
      data.items.forEach(it => parts.push(`${sector}|${it.processo}|${it.status}|${it.etapa||''}`));
    });
    parts.sort();
    return parts.join('~');
  }
  function reconcileMarks(summary){
    const sig = computeDataSignature(summary);
    if (marksStore.signature !== sig){
      marksStore = { signature: sig, marks: {} };
      saveMarks();
    }
  }
  function markKey(sector, processo){ return sector + '||' + processo; }
  function getMark(sector, processo){
    return marksStore.marks[markKey(sector, processo)] || { feito:false, passadoPara:'' };
  }
  function setMark(sector, processo, patch){
    const key = markKey(sector, processo);
    const cur = marksStore.marks[key] || { feito:false, passadoPara:'' };
    marksStore.marks[key] = Object.assign({}, cur, patch);
    saveMarks();
  }

  function styleForStatus(status){ return STATUS_STYLES[status] || DEFAULT_STYLE; }
  function worstStyle(statusCounts){
    for (const s of SEVERITY_ORDER){ if (statusCounts[s] > 0) return styleForStatus(s); }
    const keys = Object.keys(statusCounts).filter(k => statusCounts[k] > 0);
    return keys.length ? DEFAULT_STYLE : OK_STYLE;
  }
  function worstLabel(statusCounts){
    for (const s of SEVERITY_ORDER){ if (statusCounts[s] > 0) return s.toUpperCase(); }
    const keys = Object.keys(statusCounts).filter(k => statusCounts[k] > 0);
    return keys.length ? keys[0].toUpperCase() : "TUDO EM DIA";
  }
  function escapeHtml(str){
    return String(str ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  function parseFlexDate(str){
    if (!str) return null;
    const s = String(str).trim();
    let m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
    if (m){
      let [, d, mo, y] = m;
      if (y.length === 2) y = '20' + y;
      const dt = new Date(Number(y), Number(mo)-1, Number(d));
      return isNaN(dt) ? null : dt;
    }
    m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m){
      const [, y, mo, d] = m;
      const dt = new Date(Number(y), Number(mo)-1, Number(d));
      return isNaN(dt) ? null : dt;
    }
    return null;
  }
  function isSameDay(a, b){
    return a && b && a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  }
  function formatPrazoDisplay(raw){
    const d = parseFlexDate(raw);
    return d ? d.toLocaleDateString('pt-BR') : String(raw);
  }
  function sortItems(items){
    // se o setor tem prazo, ordena por vencimento (mais próximo primeiro);
    // sem data válida vai para o fim. Sem prazo, ordena por gravidade do status.
    return items.slice().sort((a,b) => {
      const da = parseFlexDate(a.prazo);
      const db = parseFlexDate(b.prazo);
      if (da && db) return da - db;
      if (da && !db) return -1;
      if (!da && db) return 1;
      const ai = SEVERITY_ORDER.includes(a.status) ? SEVERITY_ORDER.indexOf(a.status) : SEVERITY_ORDER.length;
      const bi = SEVERITY_ORDER.includes(b.status) ? SEVERITY_ORDER.indexOf(b.status) : SEVERITY_ORDER.length;
      return ai - bi;
    });
  }

  // ---------- parsing das linhas (suporta blocos lado a lado) ----------
  function findHeaderRowIndex(rows){
    for (let i=0; i<Math.min(5, rows.length); i++){
      if (rows[i] && rows[i].includes("Processo")) return i;
    }
    return 0;
  }
  function parseRowsToItems(rows){
    if (!rows || rows.length === 0) return [];
    const hIdx = findHeaderRowIndex(rows);
    const header = rows[hIdx] || [];
    const starts = [];
    header.forEach((h, i) => { if ((h||"").trim() === "Processo") starts.push(i); });
    if (starts.length === 0) return [];
    const blocks = starts.map((s, idx) => ({ start: s, end: idx+1 < starts.length ? starts[idx+1] : header.length }));
    const KNOWN = ["Processo", "Associação", "Etapa", "Status no SGS"];
    const items = [];
    for (const block of blocks){
      const local = header.slice(block.start, block.end).map(h => (h||"").trim());
      const procI = local.indexOf("Processo");
      const assocI = local.indexOf("Associação");
      const etapaI = local.indexOf("Etapa");
      const statusI = local.indexOf("Status no SGS");
      const prazoI = local.indexOf("Prazo");
      // qualquer outra coluna do bloco vira um campo extra, exibido no
      // quadro de detalhes ao clicar no protocolo (ex: Observação,
      // Vencimento, Veículo, Oficina, Etapa de Compra...)
      const extraCols = local
        .map((name, i) => ({name, i}))
        .filter(c => c.name && !KNOWN.includes(c.name));
      for (let r = hIdx+1; r < rows.length; r++){
        const row = rows[r];
        if (!row) continue;
        const proc = row[block.start + procI];
        if (!proc) continue;
        const extra = extraCols
          .map(c => ({label: c.name, value: row[block.start + c.i]}))
          .filter(f => f.value !== null && f.value !== undefined && String(f.value).trim() !== '');
        items.push({
          id: 'it_' + (itemIdCounter++),
          processo: proc,
          associacao: assocI >= 0 ? row[block.start + assocI] : null,
          etapa: etapaI >= 0 ? row[block.start + etapaI] : null,
          status: statusI >= 0 ? (row[block.start + statusI] || "Sem status") : "Sem status",
          prazo: prazoI >= 0 ? row[block.start + prazoI] : null,
          extra
        });
      }
    }
    return items;
  }

  // ---------- busca dos dados ----------
  function fetchCsv(url){
    return new Promise((resolve, reject) => {
      const bustUrl = url + (url.includes('?') ? '&' : '?') + '_=' + Date.now();
      fetch(bustUrl)
        .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
        .then(text => { resolve(Papa.parse(text, {skipEmptyLines: true}).data); })
        .catch(reject);
    });
  }

  async function buildSummary(){
    // Pré-cria as chaves na ordem fixa de SECTOR_SHEETS ANTES de buscar
    // qualquer dado. Isso garante que a ordem dos cartões nunca muda,
    // mesmo que as buscas terminem em ordens diferentes a cada ciclo.
    const sectors = {};
    for (const sector of Object.keys(SECTOR_SHEETS)){
      sectors[sector] = { total:0, statusCounts:{}, items:[], error:null };
    }
    itemsById = {};

    await Promise.all(Object.entries(SECTOR_SHEETS).map(async ([sector, url]) => {
      if (!url || url.includes('COLE_AQUI')){
        sectors[sector].error = 'not_configured';
        return;
      }
      try{
        const rows = await fetchCsv(url);
        const items = parseRowsToItems(rows);
        items.forEach(it => { itemsById[it.id] = {item: it, sector}; });
        const statusCounts = {};
        items.forEach(it => { statusCounts[it.status] = (statusCounts[it.status]||0)+1; });
        sectors[sector] = { total: items.length, statusCounts, items, error:null };
      }catch(err){
        sectors[sector] = { total:0, statusCounts:{}, items:[], error:'fetch_failed' };
      }
    }));

    return { updatedAt: new Date().toISOString(), sectors };
  }

  // ---------- filtros ----------
  function matchesAssoc(item){
    if (assocFilter === 'all') return true;
    const isMobili = (item.associacao || '').trim().toLowerCase() === MOBILI_NAME.toLowerCase();
    return assocFilter === 'mobili' ? isMobili : !isMobili;
  }

  function toggleStatusFilter(sector, status){
    sectorStatusFilter[sector] = (sectorStatusFilter[sector] === status) ? null : status;
    renderCurrentRoute();
  }

  // ---------- renderização ----------
  function fmtDateTime(iso){
    const d = new Date(iso);
    return d.toLocaleString('pt-BR', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  }

    if (!lastSummary) { mainContent.innerHTML = ''; return; }

    const configured = Object.entries(lastSummary.sectors).filter(([,d]) => d.error !== 'not_configured');
    if (configured.length === 0){
      mainContent.innerHTML = `
        <div class="empty">
          <h3>Painel ainda não configurado</h3>

    }

    let html = '<div class="grid" id="homeGrid">';
    for (const sector of getOrderedSectors()){
      const data = lastSummary.sectors[sector];
      if (!data || data.error === 'not_configured') continue;

      if (data.error === 'fetch_failed'){
        html += `
          <div class="card" data-sector="${escapeHtml(sector)}" style="--sev-solid:var(--gray-solid)">
            <div class="card-head"><h2>${escapeHtml(sector)}</h2></div>
            <div class="err-msg">Não consegui carregar os dados desta aba agora. Vou tentar de novo automaticamente.</div>
          </div>`;
        continue;
      }

      // aplica o filtro de associação primeiro — tudo abaixo (contagens,
      // total, lista) reflete somente os itens da associação selecionada
      const assocItems = data.items.filter(matchesAssoc);
      const statusCounts = {};
      assocItems.forEach(it => { statusCounts[it.status] = (statusCounts[it.status]||0)+1; });
      const total = assocItems.length;

      const sev = worstStyle(statusCounts);
      const sevLabel = worstLabel(statusCounts);
      const activeStatus = sectorStatusFilter[sector] || null;

      const badges = Object.entries(statusCounts).sort((a,b)=>b[1]-a[1]).map(([status,n]) => {
        const st = styleForStatus(status);
        const isActive = activeStatus === status;
        return `<div class="badge ${isActive?'active':''}" style="--b-bg:${st.bg};--b-text:${st.text}" onclick="toggleStatusFilter('${sector.replace(/'/g,"\\'")}','${status.replace(/'/g,"\\'")}')">${escapeHtml(status)} <span class="n">${n}</span></div>`;
      }).join('');

      const displayItems = sortItems(activeStatus ? assocItems.filter(it => it.status === activeStatus) : assocItems);

      let listHtml = '';
      if (assocItems.length > 0){

          <div class="list-title">
            <span>${activeStatus ? escapeHtml(activeStatus) : 'Todos os protocolos'}</span>
            <span>${activeStatus ? `${displayItems.length} de ${assocItems.length} &nbsp;·&nbsp; <span class="clear" onclick="toggleStatusFilter('${sector.replace(/'/g,"\\'")}','${activeStatus.replace(/'/g,"\\'")}')">limpar</span>` : assocItems.length}</span>

      }

      html += `
        <div class="card ${collapsedSectors[sector] ? 'collapsed' : ''} ${collapsedHSectors[sector] ? 'collapsed-h' : ''}" data-sector="${escapeHtml(sector)}" style="--sev-solid:${sev.solid};--sev-bg:${sev.bg};--sev-text:${sev.text}">
          <div class="card-head">
            <h2>${escapeHtml(sector)}</h2>
            <div class="card-head-right">
              <div class="led"><span class="bulb"></span>${sevLabel}</div>
              <button class="card-toggle-h" onclick="toggleCardCollapseH('${sector.replace(/'/g,"\\'")}')" title="${collapsedHSectors[sector] ? 'Alargar' : 'Estreitar'}">❮</button>
              <button class="card-toggle" onclick="toggleCardCollapse('${sector.replace(/'/g,"\\'")}')" title="${collapsedSectors[sector] ? 'Expandir' : 'Minimizar'}">⌄</button>

      handle: '.drag-handle',

      onEnd: function(){
        sectorOrder = Array.from(grid.children).map(el => el.dataset.sector).filter(Boolean);
        saveSectorOrder();
      }

  function itemRowHtml(it, sector){
    const st = styleForStatus(it.status);
    const subParts = [it.associacao, it.etapa].filter(Boolean).join(' · ');
    const mark = getMark(sector, it.processo);
    const marksHtml = (mark.feito || mark.passadoPara) ? `
      <div class="marks-row">
        ${mark.feito ? '<span class="mark-tag mark-done">✓ Feito</span>' : ''}
        ${mark.passadoPara ? `<span class="mark-tag mark-pass">→ ${escapeHtml(mark.passadoPara)}</span>` : ''}
      </div>` : '';
    return `<div class="item ${mark.feito ? 'item-done' : ''}" style="--i-bg:${st.bg};--i-dot:${st.solid}" onclick="openDetail('${it.id}')">
      <div class="procwrap">
        <span class="proc" style="${mark.feito ? 'text-decoration:line-through; text-decoration-thickness:1.5px;' : ''}">${escapeHtml(it.processo)}</span>
        ${subParts ? `<span class="sub">${escapeHtml(subParts)}</span>` : ''}

  function listSectionHtml(title, items, sector){
    if (items.length === 0){
      return `<div class="listwrap">
        <div class="list-title"><span>${escapeHtml(title)}</span><span>0</span></div>
        <div class="empty-sector">Nenhum protocolo aqui.</div>

    return `<div class="listwrap">
      <div class="list-title"><span>${escapeHtml(title)}</span><span>${items.length}</span></div>
      <div class="list">${items.map(it => itemRowHtml(it, sector)).join('')}</div>
    </div>`;
  }

  function buildEtapaChart(items, sector, activeEtapa){
    const counts = {};
    items.forEach(it => { const k = (it.etapa || '').trim() || 'Sem etapa'; counts[k] = (counts[k]||0)+1; });
    const entries = Object.entries(counts).sort((a,b) => b[1]-a[1]);
    const max = entries.length ? entries[0][1] : 0;
    return `<div class="chart-card">
      <div class="chart-title">Tarefas por etapa &middot; clique para filtrar</div>
      ${entries.length ? entries.map(([label,n]) => `
        <div class="chart-row ${activeEtapa===label?'active':''}" onclick="toggleEtapaFilter('${sector.replace(/'/g,"\\'")}','${label.replace(/'/g,"\\'")}')">
          <div class="chart-label" title="${escapeHtml(label)}">${escapeHtml(label)}</div>
          <div class="chart-bar-wrap"><div class="chart-bar" style="width:${max ? (n/max*100) : 0}%"></div></div>
          <div class="chart-value">${n}</div>
        </div>`).join('') : '<div class="empty-sector">Sem dados para exibir.</div>'}
    </div>`;
  }

  function renderSectorPage(sector){
    const mainContent = document.getElementById('mainContent');
    if (!lastSummary) { mainContent.innerHTML = ''; return; }
    const data = lastSummary.sectors[sector];

    if (!data || data.error === 'not_configured'){
      mainContent.innerHTML = `<div class="empty"><h3>Setor não encontrado</h3><p>Confira se "${escapeHtml(sector)}" existe em <code>SECTOR_SHEETS</code>.</p></div>`;
      return;
    }
    if (data.error === 'fetch_failed'){
      mainContent.innerHTML = `<div class="sector-header"><h2>${escapeHtml(sector)}</h2><div class="err-msg">Não consegui carregar os dados desta aba agora. Vou tentar de novo automaticamente.</div></div>`;
      return;
    }

    const assocItems = data.items.filter(matchesAssoc);
    const statusCounts = {};
    assocItems.forEach(it => { statusCounts[it.status] = (statusCounts[it.status]||0)+1; });
    const total = assocItems.length;
    const sev = worstStyle(statusCounts);
    const sevLabel = worstLabel(statusCounts);
    const activeStatus = sectorStatusFilter[sector] || null;
    const activeEtapa = sectorEtapaFilter[sector] || null;

    const badges = Object.entries(statusCounts).sort((a,b)=>b[1]-a[1]).map(([status,n]) => {
      const st = styleForStatus(status);
      const isActive = activeStatus === status;
      return `<div class="badge ${isActive?'active':''}" style="--b-bg:${st.bg};--b-text:${st.text}" onclick="toggleStatusFilter('${sector.replace(/'/g,"\\'")}','${status.replace(/'/g,"\\'")}')">${escapeHtml(status)} <span class="n">${n}</span></div>`;
    }).join('');

    const displayItems = sortItems(assocItems
      .filter(it => activeStatus ? it.status === activeStatus : true)
      .filter(it => activeEtapa ? ((it.etapa||'').trim() || 'Sem etapa') === activeEtapa : true));

    const activeLabelParts = [activeStatus, activeEtapa].filter(Boolean);
    const hasActiveFilter = activeLabelParts.length > 0;
    const clearBoth = () => { sectorStatusFilter[sector] = null; sectorEtapaFilter[sector] = null; renderCurrentRoute(); };
    window.__clearSectorFilters = clearBoth;

    const filterHeaderHtml = hasActiveFilter
      ? `<div class="list-title" style="margin-bottom:14px;"><span>${escapeHtml(activeLabelParts.join(' + '))}</span><span>${displayItems.length} de ${assocItems.length} &nbsp;·&nbsp; <span class="clear" onclick="window.__clearSectorFilters()">limpar</span></span></div>`
      : '';

    const hasPrazoColumn = assocItems.some(it => it.prazo);
    let listHtml;
    if (assocItems.length === 0){
      listHtml = `<div class="card"><div class="empty-sector">Sem demandas ${assocFilter !== 'all' ? 'para esse filtro' : 'hoje'}.</div></div>`;
    } else if (hasPrazoColumn){
      const today = new Date();
      const todayItems = displayItems.filter(it => isSameDay(parseFlexDate(it.prazo), today));
      const otherItems = displayItems.filter(it => !isSameDay(parseFlexDate(it.prazo), today));
      listHtml = `<div class="card sector-list">
        ${filterHeaderHtml}
        ${listSectionHtml('Tarefas de hoje (prazo hoje)', todayItems, sector)}
        ${listSectionHtml('Tarefas a fazer (outros prazos)', otherItems, sector)}
      </div>`;
    } else {
      const bodyHtml = hasActiveFilter
        ? `<div class="list">${displayItems.map(it => itemRowHtml(it, sector)).join('')}</div>`
        : listSectionHtml('Todos os protocolos', displayItems, sector);
      listHtml = `<div class="card sector-list">
        ${filterHeaderHtml}
        ${bodyHtml}
      </div>`;
    }

    mainContent.innerHTML = `
      <div class="sector-header" style="--sev-solid:${sev.solid}">
        <h2>${escapeHtml(sector)}</h2>
        <div class="total-row" style="margin-bottom:12px;"><span class="num">${total}</span><span class="lbl">demanda${total===1?'':'s'}</span>
          <div class="led" style="margin-left:14px;"><span class="bulb"></span>${sevLabel}</div>
        </div>
        <div class="badges">${badges || '<span style="color:var(--muted);font-size:13px;">Sem demandas</span>'}</div>
      </div>
      <div class="sector-layout">
        <div>${buildEtapaChart(assocItems, sector, activeEtapa)}</div>
        <div>${listHtml}</div>
      </div>`;
  }

  function toggleEtapaFilter(sector, etapa){
    sectorEtapaFilter[sector] = (sectorEtapaFilter[sector] === etapa) ? null : etapa;
    renderCurrentRoute();
  }

  // ---------- envio por WhatsApp ----------
  function etapaBreakdown(items){
    if (items.length === 0) return '';
    const counts = {};
    items.forEach(it => {
      const etapa = (it.etapa||'').trim() || 'Sem etapa';
      const assoc = (it.associacao||'').trim() || 'Sem associação';
      const k = `${etapa} · ${assoc}`;
      counts[k] = (counts[k]||0)+1;
    });
    const parts = Object.entries(counts).sort((a,b) => b[1]-a[1]).map(([k,n]) => `${k}: ${n}`);
    return ` (${parts.join(', ')})`;
  }

  function reportHeaderParts(){
    const now = new Date();
    let weekday = now.toLocaleDateString('pt-BR', {weekday: 'long'});
    weekday = weekday.charAt(0).toUpperCase() + weekday.slice(1);
    const dateStr = now.toLocaleDateString('pt-BR');
    return { weekday, dateStr };
  }
  const procWord = n => n === 1 ? 'processo' : 'processos';

  function buildGeneralReportMessage(){
    const { weekday, dateStr } = reportHeaderParts();
    const lines = [];
    lines.push('*Relatório Diário de Pendências*');
    lines.push(`${weekday} | ${dateStr}`);
    lines.push('');

    let totalAtrasos = 0, totalAlertas = 0;

    Object.keys(SECTOR_SHEETS).forEach(sector => {
      const data = lastSummary.sectors[sector];
      if (!data || data.error) return;
      const items = data.items.filter(matchesAssoc);
      const atrasadosItems = items.filter(it => it.status === 'Expirado' || it.status === 'Crítico');
      const alertaItems = items.filter(it => it.status === 'Alerta');
      totalAtrasos += atrasadosItems.length;
      totalAlertas += alertaItems.length;

      // setores sem atraso e sem alerta não entram no relatório
      if (atrasadosItems.length === 0 && alertaItems.length === 0) return;

      lines.push(`*Setor de ${sector}*`);
      lines.push(`Atrasados: ${atrasadosItems.length} ${procWord(atrasadosItems.length)}${etapaBreakdown(atrasadosItems)}`);
      lines.push(`Em alerta: ${alertaItems.length} ${procWord(alertaItems.length)}`);
      lines.push('');
    });

    lines.push('*Resumo do dia*');
    lines.push(`Total de atrasos: ${totalAtrasos} ${procWord(totalAtrasos)}`);
    lines.push(`Total de processos em alerta: ${totalAlertas} ${procWord(totalAlertas)}`);

    return lines.join('\n');
  }

  function buildSectorReportMessage(sector){
    const { weekday, dateStr } = reportHeaderParts();
    const lines = [];
    lines.push(`*Relatório - Setor de ${sector}*`);
    lines.push(`${weekday} | ${dateStr}`);
    lines.push('');

    const data = lastSummary.sectors[sector];
    if (!data || data.error){
      lines.push('Sem dados no momento.');
      return lines.join('\n');
    }

    const items = data.items.filter(matchesAssoc);
    const atrasadosItems = items.filter(it => it.status === 'Expirado' || it.status === 'Crítico');
    const alertaItems = items.filter(it => it.status === 'Alerta');

    lines.push(`Total de demandas: ${items.length} ${procWord(items.length)}`);
    lines.push(`Atrasados: ${atrasadosItems.length} ${procWord(atrasadosItems.length)}${etapaBreakdown(atrasadosItems)}`);
    lines.push(`Em alerta: ${alertaItems.length} ${procWord(alertaItems.length)}`);
    lines.push('');

    lines.push('*Por etapa (todas as demandas do setor)*');
    const etapaCounts = {};
    items.forEach(it => { const k = (it.etapa||'').trim() || 'Sem etapa'; etapaCounts[k] = (etapaCounts[k]||0)+1; });
    const etapaEntries = Object.entries(etapaCounts).sort((a,b) => b[1]-a[1]);
    if (etapaEntries.length === 0){
      lines.push('Sem demandas no momento.');
    } else {
      etapaEntries.forEach(([k,n]) => lines.push(`${k}: ${n} ${procWord(n)}`));
    }

    return lines.join('\n');
  }

  function buildWhatsAppMessage(){
    if (!lastSummary) return 'Relatório de Demandas: sem dados no momento.';
    const route = parseRoute();
    if (route.type === 'setor') return buildSectorReportMessage(route.sector);
    return buildGeneralReportMessage();
  }

  function openWhatsAppMenu(){
    const validContacts = CONTACTS.filter(c => c.phone && !c.phone.includes('COLE_O_TELEFONE'));
    const route = parseRoute();
    const menuTitle = route.type === 'setor' ? `Relatório do setor: ${route.sector}` : 'Relatório geral (todos os setores)';
    const box = document.getElementById('waBox');
    box.innerHTML = `
      <div class="modal-head">

      <div class="modal-body">
        ${validContacts.length === 0
          ? `<div class="wa-empty">Nenhum contato cadastrado ainda. Abra o arquivo, procure <code>CONTACTS</code> no início do script e cadastre nome e telefone (com DDI+DDD, só números).</div>`
          : validContacts.map((c,i) => `

  function sendWhatsApp(i){
    const contact = window.__waValidContacts[i];
    if (!contact) return;
    const text = encodeURIComponent(buildWhatsAppMessage());
    window.open(`https://wa.me/${contact.phone}?text=${text}`, '_blank');

  // ---------- relatório em imagem (mesmo layout do painel) ----------
  function buildGeneralImageBlock(){
    let rows = '';
    Object.keys(SECTOR_SHEETS).forEach(sector => {
      const data = lastSummary.sectors[sector];
      if (!data || data.error) return;
      const items = data.items.filter(matchesAssoc);
      const statusCounts = {};
      items.forEach(it => { statusCounts[it.status] = (statusCounts[it.status]||0)+1; });
      const sev = worstStyle(statusCounts);
      const badgesHtml = Object.entries(statusCounts).sort((a,b)=>b[1]-a[1]).map(([s,n]) => {
        const st = styleForStatus(s);
        return `<span style="display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:10.5px;font-weight:700;background:${st.bg};color:${st.text};margin:0 5px 5px 0;">${escapeHtml(s)} ${n}</span>`;
      }).join('');
      rows += `
        <div style="background:#fff;border-radius:13px;padding:14px 16px;margin-bottom:10px;position:relative;overflow:hidden;box-shadow:0 1px 3px rgba(20,24,40,.06);">
          <div style="position:absolute;left:0;top:0;bottom:0;width:3px;background:${sev.solid};"></div>
          <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;">
            <div style="font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:15px;color:#20243A;text-transform:uppercase;letter-spacing:.2px;">${escapeHtml(sector)}</div>
            <div style="font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:20px;color:#20243A;">${items.length}</div>
          </div>
          <div>${badgesHtml || '<span style="color:#9AA1B8;font-size:11px;">Sem demandas</span>'}</div>
        </div>`;
    });
    return rows;
  }

  function buildSectorImageBlock(sector){
    const data = lastSummary.sectors[sector];
    if (!data || data.error) return '<div style="color:#9AA1B8;font-size:12px;">Sem dados no momento.</div>';
    const items = data.items.filter(matchesAssoc);
    const statusCounts = {};
    items.forEach(it => { statusCounts[it.status] = (statusCounts[it.status]||0)+1; });
    const badgesHtml = Object.entries(statusCounts).sort((a,b)=>b[1]-a[1]).map(([s,n]) => {
      const st = styleForStatus(s);
      return `<span style="display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:10.5px;font-weight:700;background:rgba(255,255,255,.14);color:#fff;margin:0 5px 5px 0;">${escapeHtml(s)} ${n}</span>`;
    }).join('');

    const etapaCounts = {};
    items.forEach(it => { const k = (it.etapa||'').trim() || 'Sem etapa'; etapaCounts[k] = (etapaCounts[k]||0)+1; });
    const etapaEntries = Object.entries(etapaCounts).sort((a,b)=>b[1]-a[1]);
    const maxE = etapaEntries.length ? etapaEntries[0][1] : 1;
    const chartHtml = etapaEntries.map(([k,n]) => `
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
        <div style="width:120px;font-size:11px;color:#3A3F55;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(k)}</div>
        <div style="flex:1;background:#EEF0F8;border-radius:6px;height:9px;overflow:hidden;"><div style="height:100%;width:${(n/maxE*100)}%;background:#2E3178;border-radius:6px;"></div></div>
        <div style="width:20px;text-align:right;font-size:11px;color:#9AA1B8;font-weight:600;">${n}</div>
      </div>`).join('');

    return `
      <div style="background:linear-gradient(120deg,#2E3178,#3B3F94);border-radius:16px;padding:18px 20px;color:#fff;margin-bottom:12px;">
        <div style="font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.2px;margin-bottom:8px;">${escapeHtml(sector)}</div>
        <div style="font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:30px;margin-bottom:10px;">${items.length} <span style="font-size:10.5px;font-weight:600;color:#C7CAE8;text-transform:uppercase;">demandas</span></div>
        <div>${badgesHtml || ''}</div>
      </div>
      <div style="background:#fff;border-radius:14px;padding:16px 18px;box-shadow:0 1px 3px rgba(20,24,40,.06);">
        <div style="font-size:9.5px;text-transform:uppercase;letter-spacing:1.1px;color:#9AA1B8;font-weight:700;margin-bottom:12px;">Tarefas por etapa</div>
        ${chartHtml || '<div style="color:#9AA1B8;font-size:11px;">Sem dados.</div>'}
      </div>`;
  }

  function buildReportImageHtml(){
    const { weekday, dateStr } = reportHeaderParts();
    const route = parseRoute();
    const inner = route.type === 'setor' ? buildSectorImageBlock(route.sector) : buildGeneralImageBlock();
    const subtitle = route.type === 'setor' ? escapeHtml(route.sector) : 'Resumo geral';
    return `
      <div style="font-family:'Inter',system-ui,sans-serif; background:#F2F4FA; padding:24px; width:440px;">
        <div style="margin-bottom:16px;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
            <div style="width:6px;height:6px;border-radius:50%;background:#F95F45;"></div>
            <div style="font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:#9AA1B8;font-weight:700;">${subtitle}</div>
          </div>
          <div style="font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:24px;color:#20243A;letter-spacing:.2px;">Relatório Diário</div>
          <div style="color:#9AA1B8;font-size:11px;margin-top:2px;">${weekday} · ${dateStr}</div>
          <div style="height:1px;background:#E2E5F0;margin-top:14px;"></div>
        </div>
        ${inner}
      </div>`;
  }

  async function sendReportImage(){
    if (!lastSummary) return;
    const btn = document.getElementById('waImgBtn');
    const original = btn.textContent;
    btn.disabled = true;
    btn.textContent = '⏳ Gerando imagem...';
    try{
      let capture = document.getElementById('reportImageCapture');
      if (!capture){
        capture = document.createElement('div');
        capture.id = 'reportImageCapture';
        capture.style.position = 'fixed';
        capture.style.left = '-9999px';
        capture.style.top = '0';
        document.body.appendChild(capture);
      }
      capture.innerHTML = buildReportImageHtml();
      await new Promise(r => setTimeout(r, 80));
      const canvas = await html2canvas(capture.firstElementChild, {scale:2, backgroundColor:'#F2F4FA'});
      canvas.toBlob(async (blob) => {
        btn.disabled = false;
        btn.textContent = original;
        if (!blob) return;
        const file = new File([blob], 'relatorio-demandas.png', {type:'image/png'});
        let shared = false;
        if (navigator.canShare && navigator.canShare({files:[file]})){
          try{
            await navigator.share({files:[file], title:'Relatório de Demandas'});
            shared = true;
          }catch(e){ shared = true; } // usuário cancelou o compartilhamento
        }
        if (!shared){
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = 'relatorio-demandas.png';
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 4000);
          alert('Imagem baixada. Abra o WhatsApp e anexe o arquivo "relatorio-demandas.png" na conversa.');
        }
      }, 'image/png');
    }catch(err){
      btn.disabled = false;
      btn.textContent = original;
      alert('Não consegui gerar a imagem agora. Tente novamente.');
    }
  }
  document.getElementById('waImgBtn').addEventListener('click', sendReportImage);
  document.getElementById('waOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'waOverlay') closeWhatsAppMenu();
  });

  // ---------- rotas / menu lateral ----------
  function buildSidebarNav(){
    const nav = document.getElementById('sidebarNav');
    nav.innerHTML = `
      <a href="#/painel" data-key="painel"><span class="navdot"></span><span class="nav-label">Painel das Demandas</span></a>
      <div class="divider"></div>
      ${Object.keys(SECTOR_SHEETS).map(s => `<a href="#/setor/${encodeURIComponent(s)}" data-key="setor:${escapeHtml(s)}"><span class="navdot"></span><span class="nav-label">${escapeHtml(s)}</span><span class="nav-badge" id="navbadge-${encodeURIComponent(s)}">–</span></a>`).join('')}
    `;
  }

  function updateSidebarBadges(summary){
    Object.keys(SECTOR_SHEETS).forEach(sector => {
      const el = document.getElementById('navbadge-' + encodeURIComponent(sector));
      if (!el) return;
      const data = summary.sectors[sector];
      if (!data || data.error){ el.textContent = '–'; el.classList.remove('nav-badge-alert'); return; }
      const items = data.items.filter(matchesAssoc);
      const pend = items.filter(it => SEVERITY_ORDER.includes(it.status)).length;
      el.textContent = String(pend);
      el.classList.toggle('nav-badge-alert', pend > 0);
    });
  }

  function parseRoute(){
    const hash = location.hash || '#/painel';
    const parts = hash.replace(/^#\//,'').split('/');
    if (parts[0] === 'setor' && parts[1]){
      return {type:'setor', sector: decodeURIComponent(parts[1])};
    }
    return {type:'painel'};
  }

  function renderCurrentRoute(){
    const route = parseRoute();
    const activeKey = route.type === 'setor' ? 'setor:'+route.sector : 'painel';
    document.querySelectorAll('#sidebarNav a').forEach(a => {
      a.classList.toggle('active', a.dataset.key === activeKey);
    });
    if (route.type === 'setor') renderSectorPage(route.sector);
    else renderHome();
  }

  window.addEventListener('hashchange', renderCurrentRoute);

  async function refresh(){
    lastSummary = await buildSummary();
    reconcileMarks(lastSummary);
    document.getElementById('updatedAt').textContent = fmtDateTime(lastSummary.updatedAt);
    updateSidebarBadges(lastSummary);
    renderCurrentRoute();
  }

  function isPastToday(hh, mm){
    const now = new Date();
    const target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hh, mm, 0);
    return now >= target;
  }
  function updateChecklist(){
    document.querySelectorAll('#reportChecklist .check-item').forEach(el => {
      const [hh, mm] = el.dataset.target.split(':').map(Number);
      const done = isPastToday(hh, mm);
      el.classList.toggle('done', done);
      el.querySelector('.check-icon').textContent = done ? '✓' : '';
    });
  }

  function tickClock(){
    document.getElementById('clock').textContent = new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
    updateChecklist();
  }

  function openDetail(id){
    const entry = itemsById[id];
    if (!entry) return;
    const {item, sector} = entry;
    const st = styleForStatus(item.status);
    const mark = getMark(sector, item.processo);

    const baseFields = [
      {label: 'Associação', value: item.associacao},
      {label: 'Etapa', value: item.etapa}
    ].concat(item.extra || []).filter(f => f.value !== null && f.value !== undefined && String(f.value).trim() !== '');

    document.getElementById('detailBox').innerHTML = `
      <div class="modal-head">
        <div>
          <div class="proc">${escapeHtml(item.processo)}</div>
          <div class="sector">${escapeHtml(sector)}</div>
        </div>
        <button class="modal-close" onclick="closeDetail()">&times;</button>
      </div>
      <div class="modal-body">
        <span class="modal-status" style="background:${st.bg};color:${st.text}">${escapeHtml(item.status)}</span>
        ${baseFields.map(f => `
          <div class="modal-field">
            <div class="k">${escapeHtml(f.label)}</div>
            <div class="v">${escapeHtml(f.value)}</div>
          </div>`).join('')}
        <div class="track-box">
          <div class="k">Passar demanda para</div>
          <input type="text" class="track-input" id="markPassado" placeholder="Nome da pessoa responsável" value="${escapeHtml(mark.passadoPara)}">
          <button class="track-save" onclick="saveResponsavel('${item.id}')">Salvar responsável</button>
          ${mark.passadoPara ? `<div class="track-note">Responsável atual: <b>${escapeHtml(mark.passadoPara)}</b></div>` : ''}
        </div>
        <div class="track-box">
          <div class="k">Marcar como realizada</div>
          <label class="track-check">
            <input type="checkbox" id="markFeito" ${mark.feito ? 'checked' : ''}>
            Demanda foi feita
          </label>
          <button class="track-save" onclick="saveFeito('${item.id}')">Salvar</button>
          <div class="track-note">As duas marcações ficam salvas neste computador até você lançar o próximo relatório (quando atualizar a planilha).</div>
        </div>
      </div>`;
    document.getElementById('detailOverlay').classList.remove('hidden');
  }
  function saveResponsavel(id){
    const entry = itemsById[id];
    if (!entry) return;
    const passadoPara = document.getElementById('markPassado').value.trim();
    setMark(entry.sector, entry.item.processo, { passadoPara });
    closeDetail();
    renderCurrentRoute();
  }
  function saveFeito(id){
    const entry = itemsById[id];
    if (!entry) return;
    const feito = document.getElementById('markFeito').checked;
    setMark(entry.sector, entry.item.processo, { feito });
    closeDetail();
    renderCurrentRoute();
  }
  function closeDetail(){
    document.getElementById('detailOverlay').classList.add('hidden');
  }
  document.getElementById('detailOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'detailOverlay') closeDetail();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape'){ closeDetail(); closeWhatsAppMenu(); } });

  document.getElementById('assocSeg').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    assocFilter = btn.dataset.v;
    document.querySelectorAll('#assocSeg button').forEach(b => b.classList.toggle('active', b === btn));
    renderCurrentRoute();
  });

  const sidebarEl = document.getElementById('sidebar');
  const sidebarToggleBtn = document.getElementById('sidebarToggle');
  const sidebarOpenBtn = document.getElementById('sidebarOpenBtn');
  sidebarToggleBtn.addEventListener('click', () => {
    sidebarEl.classList.add('collapsed');
    sidebarOpenBtn.classList.add('show');
  });
  sidebarOpenBtn.addEventListener('click', () => {
    sidebarEl.classList.remove('collapsed');
    sidebarOpenBtn.classList.remove('show');
  });

  buildSidebarNav();
  loadMarks();
  loadSectorOrder();
  tickClock();
  setInterval(tickClock, 1000);
  refresh();
  setInterval(refresh, POLL_MS);
  </script>
</body>
</html>
