<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel SGS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F1F3F9;
    --panel: #FFFFFF;
    --panel-border: #E7E9F2;
    --panel-border-soft: #EEF0F7;
    --text: #12141C;
    --muted: #6B7280;
    --muted-soft: #9AA1B2;

    /* identidade: azul (principal) + laranja (destaque) */
    --primary: #2E51E8;
    --primary-dark: #1D3BB8;
    --primary-light: #EAF0FE;
    --sidebar-from: #131B3F;
    --sidebar-to: #202A5C;
    --accent: #FF7A3D;
    --accent-dark: #E8631F;
    --accent-light: #FFEEE2;

    --amber-bg: #FBF0DE; --amber-text: #8A5A0B; --amber-solid: #C6890F;
    --red-bg: #FBE7E5;   --red-text: #A8332A;   --red-solid: #B8392F;
    --maroon-bg: #F2E1E6; --maroon-text: #7A2E45; --maroon-solid: #7A2E45;
    --green-bg: #E4F1E9; --green-text: #24693F; --green-solid: #2F8551;
    --gray-bg: #EDEFF3;  --gray-text: #545C70;  --gray-solid: #8A93A8;

    --radius-xl: 22px;
    --radius-lg: 16px;
    --radius-md: 12px;
    --ease: cubic-bezier(.22,.9,.32,1);
    --shadow-soft: 0 1px 2px rgba(15,20,50,.04), 0 8px 20px -6px rgba(30,63,196,.08);
    --shadow-hover: 0 4px 10px rgba(15,20,50,.06), 0 18px 34px -8px rgba(30,63,196,.16);
    --shadow-modal: 0 30px 70px -12px rgba(10,14,40,.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{background:var(--bg); color:var(--text); font-family:'Inter',system-ui,sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased;}
  ::selection{background:var(--accent); color:#fff;}
  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:#D6DBE8; border-radius:8px;}
  ::-webkit-scrollbar-thumb:hover{background:#C3C9DC;}

  .app-shell{display:flex; min-height:100vh;}

  /* ---------- sidebar ---------- */
  .sidebar{
    width:256px; flex:none; color:#fff;
    background:linear-gradient(175deg, var(--sidebar-from), var(--sidebar-to) 85%);
    display:flex; flex-direction:column;
    transition:width .22s var(--ease), padding .22s var(--ease);
    overflow:hidden; position:relative;
  }
  .sidebar::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(120% 60% at 0% 0%, rgba(255,122,61,.10), transparent 60%);
  }
  .sidebar.collapsed{width:0; padding:0;}
  .sidebar-top{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 20px; border-bottom:1px solid rgba(255,255,255,.08);
    position:relative; z-index:1;
  }
  .sidebar-top .stitle{
    font-family:'Poppins',sans-serif; font-weight:700; letter-spacing:.1px; font-size:15.5px; white-space:nowrap;
    display:flex; align-items:center; gap:11px;
  }
  .sidebar-top .stitle::before{
    content:""; display:inline-flex; width:32px; height:32px; border-radius:10px; flex:none;
    background:linear-gradient(135deg, var(--accent), var(--primary));
    box-shadow:0 6px 14px rgba(255,122,61,.35);
  }
  .sidebar-toggle{
    background:rgba(255,255,255,.07); border:none; color:#fff;
    width:30px; height:30px; border-radius:9px; cursor:pointer; flex:none;
    font-size:13px; display:flex; align-items:center; justify-content:center;
    transition:background .15s var(--ease);
  }
  .sidebar-toggle:hover{background:rgba(255,255,255,.16);}
  .sidebar-nav{display:flex; flex-direction:column; padding:16px 12px; gap:3px; position:relative; z-index:1;}
  .sidebar-nav a{
    display:flex; align-items:center; gap:11px;
    color:#A6AED6; text-decoration:none; font-size:13.8px; font-weight:600;
    padding:11px 14px; border-radius:11px; white-space:nowrap;
    border-left:3px solid transparent; transition:background .15s var(--ease), color .15s var(--ease);
  }
  .sidebar-nav a:hover{background:rgba(255,255,255,.06); color:#fff;}
  .sidebar-nav a.active{
    background:linear-gradient(90deg, rgba(255,122,61,.20), rgba(255,122,61,.02));
    color:#fff; border-left-color:var(--accent);
  }
  .sidebar-nav .navdot{width:6px;height:6px;border-radius:50%; background:currentColor; opacity:.65; flex:none; transition:.15s;}
  .sidebar-nav a.active .navdot{background:var(--accent); opacity:1; box-shadow:0 0 0 3px rgba(255,122,61,.22);}
  .sidebar-nav .divider{height:1px; background:rgba(255,255,255,.08); margin:12px 8px;}

  .content-shell{flex:1; min-width:0; display:flex; flex-direction:column;}
  .sidebar-open-btn{
    position:fixed; top:16px; left:16px; z-index:40;
    width:38px; height:38px; border-radius:11px; border:none;
    background:linear-gradient(135deg, var(--primary), var(--sidebar-to)); color:#fff; cursor:pointer; font-size:15px;
    display:none; align-items:center; justify-content:center;
    box-shadow:0 8px 20px rgba(30,63,196,.32);
  }
  .sidebar-open-btn.show{display:flex;}

  /* ---------- topbar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: clamp(15px,2.1vh,21px) clamp(20px,3vw,44px);
    background:var(--panel); color:var(--text);
    border-bottom:1px solid var(--panel-border);
  }
  .brand{display:flex; align-items:center; gap:14px;}
  .brand .dot{
    width:38px;height:38px;border-radius:12px; flex:none;
    background:linear-gradient(135deg, var(--primary), var(--accent));
    box-shadow:0 6px 16px rgba(47,85,234,.28);
  }
  .brand h1{font-family:'Poppins',sans-serif; font-weight:700; letter-spacing:0; font-size:clamp(17px,2vw,22px); margin:0; color:var(--text);}
  .brand span.sub{color:var(--muted); font-size:clamp(10px,.8vw,11.5px); text-transform:uppercase; letter-spacing:1.6px;}
  .meta{display:flex; align-items:center; gap:clamp(12px,2vw,24px);}
  .meta .clock{
    font-family:'JetBrains Mono',monospace; font-size:clamp(13px,1.4vw,16.5px); font-weight:600; color:var(--primary);
    background:var(--primary-light); padding:8px 14px; border-radius:10px; letter-spacing:.3px;
  }
  .meta .updated{font-size:clamp(10px,.78vw,11.5px); color:var(--muted); text-align:right; line-height:1.5;}
  .meta .updated b{color:var(--text); font-weight:600; font-family:'JetBrains Mono',monospace;}

  /* ---------- filterbar ---------- */
  .filterbar{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding: 13px clamp(20px,3vw,44px);
    background:#FAFBFD; border-bottom:1px solid var(--panel-border);
  }
  .filterbar .flabel{font-size:10.5px; text-transform:uppercase; letter-spacing:1.3px; color:var(--muted-soft); margin-right:2px; font-weight:700;}
  .seg{display:flex; gap:4px; background:#fff; padding:4px; border-radius:999px; border:1px solid var(--panel-border);}
  .seg button{
    font-family:'Inter',sans-serif; font-size:12.8px; font-weight:600;
    padding:7px 15px; border-radius:999px; border:none;
    background:transparent; color:var(--muted); cursor:pointer; transition:.18s var(--ease);
  }
  .seg button:hover{color:var(--text);}
  .seg button.active{background:linear-gradient(135deg, var(--primary), var(--primary-dark)); color:#fff; box-shadow:0 4px 10px rgba(47,85,234,.3);}

  .wa-btn{
    font-family:'Inter',sans-serif; font-size:12.8px; font-weight:700;
    padding:9px 18px; border-radius:999px; border:none; cursor:pointer;
    background:linear-gradient(135deg, #27D466, #1CA754); color:#fff; transition:.18s var(--ease);
    box-shadow:0 4px 12px rgba(37,211,102,.32);
  }
  .wa-btn:hover{filter:brightness(1.03); transform:translateY(-1px); box-shadow:0 6px 16px rgba(37,211,102,.4);}
  .wa-contact{
    display:flex; justify-content:space-between; align-items:center;
    padding:13px 15px; border:1px solid var(--panel-border); border-radius:var(--radius-md);
    margin-bottom:8px; cursor:pointer; transition:.18s var(--ease);
  }
  .wa-contact:hover{border-color:#25D366; background:#F3FBF6; transform:translateY(-1px); box-shadow:0 6px 14px rgba(37,211,102,.12);}
  .wa-contact .wa-name{font-weight:700; font-size:13.8px; color:var(--text);}
  .wa-contact .wa-phone{font-family:'JetBrains Mono',monospace; font-size:11.3px; color:var(--muted); margin-top:2px;}
  .wa-contact .wa-send{color:#25D366; font-size:19px;}
  .wa-empty{color:var(--muted); font-size:13.3px; line-height:1.6;}

  .marks-row{display:flex; gap:6px; margin-top:6px; flex-wrap:wrap;}
  .mark-tag{font-size:10.3px; font-weight:700; padding:3px 9px; border-radius:999px; display:inline-block;}
  .mark-tag.mark-done{background:var(--green-bg); color:var(--green-text);}
  .mark-tag.mark-pass{background:var(--gray-bg); color:var(--gray-text);}
  .item.item-done{opacity:.58;}

  .track-box{border-top:1px solid var(--panel-border); padding-top:16px; margin-top:4px;}
  .track-box .k{font-size:10.3px; text-transform:uppercase; letter-spacing:1.2px; color:var(--muted); margin-bottom:10px; font-weight:700;}
  .track-check{display:flex; align-items:center; gap:9px; font-size:14px; font-weight:600; margin-bottom:12px; cursor:pointer;}
  .track-check input{width:17px; height:17px; cursor:pointer; accent-color:var(--primary);}
  .track-input{
    width:100%; padding:11px 13px; border:1.5px solid var(--panel-border); border-radius:10px;
    font-size:13.4px; font-family:'Inter',sans-serif; margin-bottom:12px; transition:.15s var(--ease);
  }
  .track-input:focus{outline:none; border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-light);}
  .track-save{
    background:linear-gradient(135deg, var(--accent), var(--accent-dark)); color:#fff; border:none; padding:10px 20px;
    border-radius:10px; font-weight:700; font-size:12.8px; cursor:pointer; transition:.18s var(--ease);
    box-shadow:0 4px 12px rgba(255,122,61,.3);
  }
  .track-save:hover{filter:brightness(1.03); transform:translateY(-1px); box-shadow:0 6px 16px rgba(255,122,61,.38);}
  .track-note{font-size:11px; color:var(--muted); margin-top:10px; line-height:1.5;}

  .checklist{display:flex; align-items:center; gap:9px; flex-wrap:wrap;}
  .check-item{
    display:flex; align-items:center; gap:8px;
    font-size:12.6px; font-weight:600; color:var(--gray-text);
    background:var(--gray-bg); border:1px solid var(--panel-border);
    padding:7px 14px 7px 10px; border-radius:999px; transition:.18s var(--ease);
  }
  .check-item .check-icon{
    width:16px; height:16px; border-radius:50%; flex:none;
    display:flex; align-items:center; justify-content:center;
    border:1.5px solid #B7BEC9; background:#fff; font-size:10.5px; color:#fff;
  }
  .check-item.done{color:var(--green-text); background:var(--green-bg); border-color:transparent;}
  .check-item.done .check-icon{background:var(--green-solid); border-color:var(--green-solid);}

  /* ---------- conteúdo / cards ---------- */
  main{padding: clamp(20px,2.6vh,30px) clamp(20px,3vw,44px);}
  .grid{display:flex; flex-wrap:wrap; align-items:flex-start; gap: clamp(16px,1.7vw,20px);}
  .card{
    background:var(--panel); border:1px solid var(--panel-border); border-radius:var(--radius-xl);
    padding:clamp(18px,1.8vw,23px); position:relative; overflow:hidden;
    display:flex; flex-direction:column; gap:14px;
    box-shadow: var(--shadow-soft);
    flex:1 1 340px; min-width:340px; max-width:100%;
    transition: flex-basis .22s var(--ease), min-width .22s var(--ease), max-width .22s var(--ease), box-shadow .2s var(--ease), transform .2s var(--ease);
  }
  .card:hover{box-shadow:var(--shadow-hover); transform:translateY(-2px);}
  .card.collapsed-h{flex:0 0 132px; min-width:132px; max-width:132px; padding:15px 13px;}
  .card.collapsed-h .card-body{display:none;}
  .card.collapsed-h .card-head{flex-direction:column; align-items:flex-start; gap:9px;}
  .card.dragging{opacity:.4;}
  .card.sortable-ghost{opacity:.22; box-shadow:none;}
  .card::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--sev-solid, var(--gray-solid)); border-radius:0 4px 4px 0;}
  .card-head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .card-head h2{font-family:'Poppins',sans-serif; font-weight:700; font-size:clamp(15.5px,1.4vw,18px); margin:0; letter-spacing:0; line-height:1.2; color:#0F1220;}
  .card-head-right{display:flex; align-items:center; gap:6px; flex:none;}
  .card-toggle, .card-toggle-h{
    background:var(--primary-light); border:none; width:26px; height:26px; border-radius:9px;
    cursor:pointer; font-size:12.5px; color:var(--primary);
    display:flex; align-items:center; justify-content:center;
    transition:transform .18s var(--ease), background .15s var(--ease); flex:none;
  }
  .card-toggle:hover, .card-toggle-h:hover{background:#DEE7FD; color:var(--primary-dark);}
  .card.collapsed .card-toggle{transform:rotate(-90deg);}
  .card.collapsed .card-body{display:none;}
  .card.collapsed-h .card-toggle-h{transform:rotate(180deg);}
  .drag-handle{
    cursor:grab; color:var(--muted-soft); font-size:15px; padding:4px 5px; flex:none; border-radius:8px;
    display:flex; align-items:center; justify-content:center; user-select:none; transition:.15s var(--ease);
  }
  .drag-handle:hover{color:var(--primary); background:var(--primary-light);}
  .drag-handle:active{cursor:grabbing;}
  .led{
    display:flex; align-items:center; gap:6px;
    font-family:'JetBrains Mono',monospace; font-size:10.3px; font-weight:600;
    text-transform:uppercase; letter-spacing:.5px; white-space:nowrap;
    padding:5px 11px; border-radius:999px;
    background:var(--sev-bg, var(--gray-bg)); color:var(--sev-text, var(--gray-text));
  }
  .led .bulb{width:6px;height:6px;border-radius:50%; background:var(--sev-solid, var(--gray-solid)); box-shadow:0 0 0 3px color-mix(in srgb, var(--sev-solid, var(--gray-solid)) 20%, transparent);}

  .total-row{display:flex; align-items:baseline; gap:10px;}
  .total-row .num{font-family:'Poppins',sans-serif; font-weight:800; font-size:clamp(28px,2.8vw,38px); line-height:1; color:#0F1220;}
  .total-row .lbl{color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:1.2px; font-weight:700;}

  .badges{display:flex; flex-wrap:wrap; gap:7px;}
  .badge{
    display:flex; align-items:center; gap:6px; padding:6px 13px; border-radius:999px;
    font-size:12.3px; font-weight:600; cursor:pointer; border:1.5px solid transparent;
    background:var(--b-bg); color:var(--b-text); transition:.15s var(--ease);
  }
  .badge:hover{filter:brightness(0.97); transform:translateY(-1px);}
  .badge.active{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent);}
  .badge .n{font-family:'JetBrains Mono',monospace;}

  .listwrap{border-top:1px solid var(--panel-border-soft); padding-top:12px;}
  .list-title{font-size:10.3px; text-transform:uppercase; letter-spacing:1.2px; color:var(--muted); margin-bottom:9px; display:flex; justify-content:space-between; align-items:center; font-weight:700;}
  .list-title .clear{cursor:pointer; color:var(--accent-dark); text-transform:none; letter-spacing:0; font-weight:700;}
  .list{display:flex; flex-direction:column; gap:7px; max-height:400px; overflow-y:auto; padding-right:4px;}
  .item{
    display:flex; align-items:center; gap:10px; font-size:12.4px;
    background:#FAFBFD; border:1px solid var(--panel-border-soft);
    border-radius:12px; padding:9px 12px; cursor:pointer; transition:.15s var(--ease);
  }
  .item:hover{border-color:var(--primary); background:var(--primary-light); transform:translateX(2px);}
  .item .procwrap{flex:1; min-width:0;}
  .item .proc{font-family:'JetBrains Mono',monospace; font-weight:600; color:#0F1220; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .item .sub{color:var(--muted); font-size:10.8px; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .item .prazo-tag{color:var(--accent-dark); font-size:10.8px; font-weight:700; display:block; margin-top:2px;}
  .item .st{font-size:10.3px; font-weight:700; text-transform:uppercase; letter-spacing:.3px; padding:4px 10px; border-radius:999px; white-space:nowrap;}
  .ok-msg{display:flex; align-items:center; gap:8px; color:var(--green-text); font-weight:600; font-size:13.4px;}
  .err-msg{color:var(--red-text); font-size:13px;}
  .empty-sector{color:var(--muted); font-size:13px;}

  .empty{text-align:center; padding: 10vh 20px; color:var(--muted);}
  .empty h3{color:var(--text); font-family:'Poppins',sans-serif; font-size:21px; margin-bottom:8px; font-weight:700;}
  .empty p{max-width:520px; margin:0 auto; line-height:1.6;}
  .empty code{background:#E3E6EC; padding:2px 6px; border-radius:5px; font-size:12px;}

  /* ---------- página de setor ---------- */
  .sector-header{
    background:linear-gradient(120deg, var(--panel) 55%, var(--primary-light) 145%);
    border:1px solid var(--panel-border); border-radius:var(--radius-xl);
    padding:clamp(20px,2.2vw,29px); margin-bottom:clamp(16px,1.7vw,21px);
    box-shadow: var(--shadow-soft);
    position:relative; overflow:hidden;
  }
  .sector-header::before{content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--sev-solid, var(--gray-solid));}
  .sector-header h2{font-family:'Poppins',sans-serif; font-weight:700; font-size:clamp(21px,2.5vw,29px); margin:0 0 12px; color:#0F1220;}
  .sector-layout{display:grid; grid-template-columns:minmax(280px,1fr) minmax(280px,1.4fr); gap:clamp(16px,1.7vw,21px); align-items:start;}
  @media (max-width: 860px){ .sector-layout{grid-template-columns:1fr;} }

  .chart-card{
    background:var(--panel); border:1px solid var(--panel-border); border-radius:var(--radius-xl);
    padding:clamp(18px,1.8vw,23px);
    box-shadow: var(--shadow-soft);
  }
  .chart-title{font-size:10.8px; text-transform:uppercase; letter-spacing:1.2px; color:var(--muted); margin-bottom:16px; font-weight:700;}
  .chart-row{display:flex; align-items:center; gap:10px; margin-bottom:10px; cursor:pointer; padding:5px 7px; margin:0 -7px 8px; border-radius:10px; transition:.15s var(--ease);}
  .chart-row:hover{background:var(--primary-light);}
  .chart-row.active .chart-label{color:var(--accent-dark);}
  .chart-row.active .chart-bar{background:linear-gradient(90deg, var(--accent), var(--accent-dark));}
  .chart-row .chart-label{width:38%; font-size:12.3px; color:var(--text); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .chart-bar-wrap{flex:1; background:var(--gray-bg); border-radius:7px; height:13px; overflow:hidden;}
  .chart-bar{height:100%; background:linear-gradient(90deg, var(--primary), var(--primary-dark)); border-radius:7px; transition:width .35s var(--ease);}
  .chart-value{width:28px; text-align:right; font-family:'JetBrains Mono',monospace; font-size:12.3px; color:var(--muted); font-weight:600;}

  .sector-list .list{max-height:560px;}

  footer.tvfoot{text-align:center; color:var(--muted-soft); font-size:11.3px; padding:18px; letter-spacing:.3px;}

  /* ---------- modais ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,14,35,.58);
    backdrop-filter:blur(5px);
    display:flex; align-items:center; justify-content:center;
    z-index:100; padding:20px;
  }
  .modal-overlay.hidden{display:none;}
  .modal-box{
    background:#fff; border-radius:var(--radius-xl); width:100%; max-width:480px;
    max-height:82vh; overflow-y:auto;
    box-shadow: var(--shadow-modal);
    animation: modalIn .22s var(--ease);
  }
  @keyframes modalIn{ from{opacity:0; transform:translateY(8px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);} }
  .modal-head{
    background:linear-gradient(120deg, var(--sidebar-from), var(--sidebar-to)); color:#fff; padding:22px 26px;
    display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
    position:sticky; top:0;
  }
  .modal-head .proc{font-family:'JetBrains Mono',monospace; font-size:17.5px; font-weight:600;}
  .modal-head .sector{color:#A6AED6; font-size:10.8px; text-transform:uppercase; letter-spacing:1.3px; margin-top:4px;}
  .modal-close{background:rgba(255,255,255,.1); border:none; color:#fff; font-size:19px; cursor:pointer; line-height:1; width:29px; height:29px; border-radius:9px; display:flex; align-items:center; justify-content:center; transition:.15s var(--ease);}
  .modal-close:hover{background:rgba(255,255,255,.2);}
  .modal-body{padding:24px 26px;}

<body>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <span class="stitle">Painel SGS</span>
        <button class="sidebar-toggle" id="sidebarToggle" title="Esconder menu">&#10094;</button>

      <nav class="sidebar-nav" id="sidebarNav"></nav>
    </aside>

    <div class="content-shell">
      <button class="sidebar-open-btn" id="sidebarOpenBtn" title="Mostrar menu">&#9776;</button>

      <div class="topbar">
        <div class="brand">
          <span class="dot"></span>
          <div>
            <h1>Painel de Demandas</h1>
            <div class="sub">Acompanhamento SGS &middot; por setor</div>
          </div>
        </div>
        <div class="meta">
          <div class="clock" id="clock">--:--:--</div>
          <div class="updated">Última atualização<br><b id="updatedAt">—</b></div>
        </div>
      </div>

      <div class="filterbar">
        <span class="flabel">Associação</span>
        <div class="seg" id="assocSeg">
          <button data-v="all" class="active">Todas</button>
          <button data-v="mobili">Mobili</button>
          <button data-v="others">Outras Associações</button>
        </div>
        <div class="checklist" id="reportChecklist">
          <span class="flabel">Checklist do dia</span>
          <div class="check-item" data-target="09:20"><span class="check-icon"></span>Relatório Manhã (09h20)</div>
          <div class="check-item" data-target="14:00"><span class="check-icon"></span>Relatório Tarde (14h00)</div>
        </div>
        <button class="wa-btn" id="waBtn" style="margin-left:auto;">📲 Enviar por WhatsApp</button>
      </div>

      <main id="mainContent"></main>

      <footer class="tvfoot">Os dados vêm direto da planilha do Google. Para atualizar, edite a planilha — o painel lê os dados novos automaticamente.</footer>
    </div>
  </div>

  <div class="modal-overlay hidden" id="detailOverlay">
    <div class="modal-box" id="detailBox"></div>
  </div>

  <div class="modal-overlay hidden" id="waOverlay">
    <div class="modal-box" id="waBox"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
  <script>
  // ============================================================
  // CONFIGURAÇÃO
  // ============================================================
  const SPREADSHEET_ID = "1CkRcn649mVP7POSoWzK8n_JiY_CKWN-IVyXBC_TOIZk";
  function csvUrl(gid){
    return `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${gid}`;
  }
  // A ordem aqui é a ordem FIXA em que os setores sempre aparecem.
  const SECTOR_SHEETS = {
    "Comunicação":      csvUrl(0),
    "Analise":          csvUrl(393471051),
    "Peças":            csvUrl(1322980367),
    "Juridico":         csvUrl(1980625187),
    "Regulação":        csvUrl(847417293),
    "Auditoria":        csvUrl(382210428),
    "Amparo Integral":  csvUrl(246111584)
  };

  const POLL_MS = 20000;

  // Nome exato da associação usada no filtro "Mobili" (deve bater com a
  // coluna Associação da planilha).
  const MOBILI_NAME = "Mobili";

  // Pessoas que podem receber a atualização por WhatsApp. Telefone no
  // formato DDI+DDD+número, só dígitos (ex: 55 11 91234-5678 vira
  // "5511912345678"). Adicione ou remova linhas à vontade.
 const CONTACTS = [
    { name: "LIDIANE", phone: "553181200249" },
    { name: "Gustavo Rocha", phone: "553184139245" },
    { name: "Guilherme Tavares", phone: "553195650704" },
    { name: "Juciele", phone: "553191906258" },
    { name: "Alesther", phone: "553182578326" },
    { name: "Cristiano", phone: "553188420088" },
    { name: "Emerson", phone: "553195985419" },
    { name: "Flávio", phone: "553187120280" },
    { name: "Guilherme Modesto", phone: "553191820595" },
    { name: "Harrison", phone: "553188670460" },
    { name: "Miriam", phone: "553189199335" },
    { name: "Rafaela", phone: "553191244768" },
    { name: "Samy", phone: "553192564369" },
    { name: "Saymom", phone: "553181119931" },
    { name: "Tiago", phone: "553183730810" },
    { name: "Victor", phone: "553193439777" },
    { name: "Mariana", phone: "553171003849" },
    { name: "Marcela", phone: "553195173014" }
];

  // Ordem de gravidade dos status conhecidos (o primeiro é o mais grave).
  // Qualquer status que não esteja nesta lista (ex: "No prazo") aparece
  // depois, na cor neutra/verde por padrão.
  const SEVERITY_ORDER = ["Expirado", "Crítico", "Alerta"];
  const STATUS_STYLES = {
    "Expirado": {bg:"var(--maroon-bg)", text:"var(--maroon-text)", solid:"var(--maroon-solid)"},
    "Crítico":  {bg:"var(--red-bg)",    text:"var(--red-text)",    solid:"var(--red-solid)"},
    "Alerta":   {bg:"var(--amber-bg)",  text:"var(--amber-text)",  solid:"var(--amber-solid)"},
    "No prazo": {bg:"var(--green-bg)",  text:"var(--green-text)",  solid:"var(--green-solid)"}
  };
  const DEFAULT_STYLE = {bg:"var(--gray-bg)", text:"var(--gray-text)", solid:"var(--gray-solid)"};
  const OK_STYLE = {bg:"var(--green-bg)", text:"var(--green-text)", solid:"var(--green-solid)"};
  // ============================================================

  let lastSummary = null;
  let assocFilter = 'all';               // 'all' | 'mobili' | 'others'
  const sectorStatusFilter = {};         // sector -> status string | null
  const sectorEtapaFilter = {};          // sector -> etapa string | null
  const collapsedSectors = {};           // sector -> bool (cards minimizados no painel geral)
  const collapsedHSectors = {};          // sector -> bool (cards estreitados na horizontal)

  // ---------- ordem dos cards (arrastar e soltar) ----------
  const ORDER_KEY = 'sgs_sector_order_v1';
  let sectorOrder = [];
  function loadSectorOrder(){
    try{
      const raw = localStorage.getItem(ORDER_KEY);
      if (raw) sectorOrder = JSON.parse(raw);
    }catch(e){ sectorOrder = []; }
  }
  function saveSectorOrder(){
    try{ localStorage.setItem(ORDER_KEY, JSON.stringify(sectorOrder)); }catch(e){}
  }
  function getOrderedSectors(){
    const allKeys = Object.keys(SECTOR_SHEETS);
    const known = sectorOrder.filter(s => allKeys.includes(s));
    const missing = allKeys.filter(s => !known.includes(s));
    return known.concat(missing);
  }
  let itemIdCounter = 0;
  let itemsById = {};                    // id -> {item, sector} para abrir o modal de detalhes

  // ---------- marcações dos gestores (feito / passado para) ----------
  // Guardadas no navegador (localStorage) e resetadas automaticamente
  // sempre que os dados da planilha mudam (ou seja, quando você lança
  // o próximo relatório).
  const MARKS_KEY = 'sgs_marks_v1';
  let marksStore = { signature: null, marks: {} };

  function loadMarks(){
    try{
      const raw = localStorage.getItem(MARKS_KEY);
      if (raw) marksStore = JSON.parse(raw);
    }catch(e){ marksStore = { signature: null, marks: {} }; }
  }
  function saveMarks(){
    try{ localStorage.setItem(MARKS_KEY, JSON.stringify(marksStore)); }catch(e){}
  }
  function computeDataSignature(summary){
    const parts = [];
    Object.entries(summary.sectors).forEach(([sector, data]) => {
      if (data.error) return;
      data.items.forEach(it => parts.push(`${sector}|${it.processo}|${it.status}|${it.etapa||''}`));
    });
    parts.sort();
    return parts.join('~');
  }
  function reconcileMarks(summary){
    const sig = computeDataSignature(summary);
    if (marksStore.signature !== sig){
      marksStore = { signature: sig, marks: {} };
      saveMarks();
    }
  }
  function markKey(sector, processo){ return sector + '||' + processo; }
  function getMark(sector, processo){
    return marksStore.marks[markKey(sector, processo)] || { feito:false, passadoPara:'' };
  }
  function setMark(sector, processo, patch){
    const key = markKey(sector, processo);
    const cur = marksStore.marks[key] || { feito:false, passadoPara:'' };
    marksStore.marks[key] = Object.assign({}, cur, patch);
    saveMarks();
  }

  function styleForStatus(status){ return STATUS_STYLES[status] || DEFAULT_STYLE; }
  function worstStyle(statusCounts){
    for (const s of SEVERITY_ORDER){ if (statusCounts[s] > 0) return styleForStatus(s); }
    const keys = Object.keys(statusCounts).filter(k => statusCounts[k] > 0);
    return keys.length ? DEFAULT_STYLE : OK_STYLE;
  }
  function worstLabel(statusCounts){
    for (const s of SEVERITY_ORDER){ if (statusCounts[s] > 0) return s.toUpperCase(); }
    const keys = Object.keys(statusCounts).filter(k => statusCounts[k] > 0);
    return keys.length ? keys[0].toUpperCase() : "TUDO EM DIA";
  }
  function escapeHtml(str){
    return String(str ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  function parseFlexDate(str){
    if (!str) return null;
    const s = String(str).trim();
    let m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
    if (m){
      let [, d, mo, y] = m;
      if (y.length === 2) y = '20' + y;
      const dt = new Date(Number(y), Number(mo)-1, Number(d));
      return isNaN(dt) ? null : dt;
    }
    m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m){
      const [, y, mo, d] = m;
      const dt = new Date(Number(y), Number(mo)-1, Number(d));
      return isNaN(dt) ? null : dt;
    }
    return null;
  }
  function isSameDay(a, b){
    return a && b && a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  }
  function formatPrazoDisplay(raw){
    const d = parseFlexDate(raw);
    return d ? d.toLocaleDateString('pt-BR') : String(raw);
  }
  function sortItems(items){
    // se o setor tem prazo, ordena por vencimento (mais próximo primeiro);
    // sem data válida vai para o fim. Sem prazo, ordena por gravidade do status.
    return items.slice().sort((a,b) => {
      const da = parseFlexDate(a.prazo);
      const db = parseFlexDate(b.prazo);
      if (da && db) return da - db;
      if (da && !db) return -1;
      if (!da && db) return 1;
      const ai = SEVERITY_ORDER.includes(a.status) ? SEVERITY_ORDER.indexOf(a.status) : SEVERITY_ORDER.length;
      const bi = SEVERITY_ORDER.includes(b.status) ? SEVERITY_ORDER.indexOf(b.status) : SEVERITY_ORDER.length;
      return ai - bi;
    });
  }

  // ---------- parsing das linhas (suporta blocos lado a lado) ----------
  function findHeaderRowIndex(rows){
    for (let i=0; i<Math.min(5, rows.length); i++){
      if (rows[i] && rows[i].includes("Processo")) return i;
    }
    return 0;
  }
  function parseRowsToItems(rows){
    if (!rows || rows.length === 0) return [];
    const hIdx = findHeaderRowIndex(rows);
    const header = rows[hIdx] || [];
    const starts = [];
    header.forEach((h, i) => { if ((h||"").trim() === "Processo") starts.push(i); });
    if (starts.length === 0) return [];
    const blocks = starts.map((s, idx) => ({ start: s, end: idx+1 < starts.length ? starts[idx+1] : header.length }));
    const KNOWN = ["Processo", "Associação", "Etapa", "Status no SGS"];
    const items = [];
    for (const block of blocks){
      const local = header.slice(block.start, block.end).map(h => (h||"").trim());
      const procI = local.indexOf("Processo");
      const assocI = local.indexOf("Associação");
      const etapaI = local.indexOf("Etapa");
      const statusI = local.indexOf("Status no SGS");
      const prazoI = local.indexOf("Prazo");
      // qualquer outra coluna do bloco vira um campo extra, exibido no
      // quadro de detalhes ao clicar no protocolo (ex: Observação,
      // Vencimento, Veículo, Oficina, Etapa de Compra...)
      const extraCols = local
        .map((name, i) => ({name, i}))
        .filter(c => c.name && !KNOWN.includes(c.name));
      for (let r = hIdx+1; r < rows.length; r++){
        const row = rows[r];
        if (!row) continue;
        const proc = row[block.start + procI];
        if (!proc) continue;
        const extra = extraCols
          .map(c => ({label: c.name, value: row[block.start + c.i]}))
          .filter(f => f.value !== null && f.value !== undefined && String(f.value).trim() !== '');
        items.push({
          id: 'it_' + (itemIdCounter++),
          processo: proc,
          associacao: assocI >= 0 ? row[block.start + assocI] : null,
          etapa: etapaI >= 0 ? row[block.start + etapaI] : null,
          status: statusI >= 0 ? (row[block.start + statusI] || "Sem status") : "Sem status",
          prazo: prazoI >= 0 ? row[block.start + prazoI] : null,
          extra
        });
      }
    }
    return items;
  }

  // ---------- busca dos dados ----------
  function fetchCsv(url){
    return new Promise((resolve, reject) => {
      const bustUrl = url + (url.includes('?') ? '&' : '?') + '_=' + Date.now();
      fetch(bustUrl)
        .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
        .then(text => { resolve(Papa.parse(text, {skipEmptyLines: true}).data); })
        .catch(reject);
    });
  }

  async function buildSummary(){
    // Pré-cria as chaves na ordem fixa de SECTOR_SHEETS ANTES de buscar
    // qualquer dado. Isso garante que a ordem dos cartões nunca muda,
    // mesmo que as buscas terminem em ordens diferentes a cada ciclo.
    const sectors = {};
    for (const sector of Object.keys(SECTOR_SHEETS)){
      sectors[sector] = { total:0, statusCounts:{}, items:[], error:null };
    }
    itemsById = {};

    await Promise.all(Object.entries(SECTOR_SHEETS).map(async ([sector, url]) => {
      if (!url || url.includes('COLE_AQUI')){
        sectors[sector].error = 'not_configured';
        return;
      }
      try{
        const rows = await fetchCsv(url);
        const items = parseRowsToItems(rows);
        items.forEach(it => { itemsById[it.id] = {item: it, sector}; });
        const statusCounts = {};
        items.forEach(it => { statusCounts[it.status] = (statusCounts[it.status]||0)+1; });
        sectors[sector] = { total: items.length, statusCounts, items, error:null };
      }catch(err){
        sectors[sector] = { total:0, statusCounts:{}, items:[], error:'fetch_failed' };
      }
    }));

    return { updatedAt: new Date().toISOString(), sectors };
  }

  // ---------- filtros ----------
  function matchesAssoc(item){
    if (assocFilter === 'all') return true;
    const isMobili = (item.associacao || '').trim().toLowerCase() === MOBILI_NAME.toLowerCase();
    return assocFilter === 'mobili' ? isMobili : !isMobili;
  }

  function toggleStatusFilter(sector, status){
    sectorStatusFilter[sector] = (sectorStatusFilter[sector] === status) ? null : status;
    renderCurrentRoute();
  }

  // ---------- renderização ----------
  function fmtDateTime(iso){
    const d = new Date(iso);
    return d.toLocaleString('pt-BR', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  }

  function renderHome(){
    const mainContent = document.getElementById('mainContent');
    if (!lastSummary) { mainContent.innerHTML = ''; return; }

    const configured = Object.entries(lastSummary.sectors).filter(([,d]) => d.error !== 'not_configured');
    if (configured.length === 0){
      mainContent.innerHTML = `
        <div class="empty">
          <h3>Painel ainda não configurado</h3>
          <p>Confira o <code>SPREADSHEET_ID</code> e os <code>gid</code> de cada aba no início do script.</p>
        </div>`;
      return;
    }

    let html = '<div class="grid" id="homeGrid">';
    for (const sector of getOrderedSectors()){
      const data = lastSummary.sectors[sector];
      if (!data || data.error === 'not_configured') continue;

      if (data.error === 'fetch_failed'){
        html += `
          <div class="card" data-sector="${escapeHtml(sector)}" style="--sev-solid:var(--gray-solid)">
            <div class="card-head"><h2>${escapeHtml(sector)}</h2></div>
            <div class="err-msg">Não consegui carregar os dados desta aba agora. Vou tentar de novo automaticamente.</div>
          </div>`;
        continue;
      }

      // aplica o filtro de associação primeiro — tudo abaixo (contagens,
      // total, lista) reflete somente os itens da associação selecionada
      const assocItems = data.items.filter(matchesAssoc);
      const statusCounts = {};
      assocItems.forEach(it => { statusCounts[it.status] = (statusCounts[it.status]||0)+1; });
      const total = assocItems.length;

      const sev = worstStyle(statusCounts);
      const sevLabel = worstLabel(statusCounts);
      const activeStatus = sectorStatusFilter[sector] || null;

      const badges = Object.entries(statusCounts).sort((a,b)=>b[1]-a[1]).map(([status,n]) => {
        const st = styleForStatus(status);
        const isActive = activeStatus === status;
        return `<div class="badge ${isActive?'active':''}" style="--b-bg:${st.bg};--b-text:${st.text}" onclick="toggleStatusFilter('${sector.replace(/'/g,"\\'")}','${status.replace(/'/g,"\\'")}')">${escapeHtml(status)} <span class="n">${n}</span></div>`;
      }).join('');

      const displayItems = sortItems(activeStatus ? assocItems.filter(it => it.status === activeStatus) : assocItems);

      let listHtml = '';
      if (assocItems.length > 0){
        listHtml = `<div class="listwrap">
          <div class="list-title">
            <span>${activeStatus ? escapeHtml(activeStatus) : 'Todos os protocolos'}</span>
            <span>${activeStatus ? `${displayItems.length} de ${assocItems.length} &nbsp;·&nbsp; <span class="clear" onclick="toggleStatusFilter('${sector.replace(/'/g,"\\'")}','${activeStatus.replace(/'/g,"\\'")}')">limpar</span>` : assocItems.length}</span>
          </div>
          <div class="list">
            ${displayItems.map(it => itemRowHtml(it, sector)).join('')}
          </div>
        </div>`;
      } else {
        listHtml = `<div class="empty-sector">Sem demandas ${assocFilter !== 'all' ? 'para esse filtro' : 'hoje'}.</div>`;
      }

      html += `
        <div class="card ${collapsedSectors[sector] ? 'collapsed' : ''} ${collapsedHSectors[sector] ? 'collapsed-h' : ''}" data-sector="${escapeHtml(sector)}" style="--sev-solid:${sev.solid};--sev-bg:${sev.bg};--sev-text:${sev.text}">
          <div class="card-head">
            <h2>${escapeHtml(sector)}</h2>
            <div class="card-head-right">
              <div class="led"><span class="bulb"></span>${sevLabel}</div>
              <button class="card-toggle-h" onclick="toggleCardCollapseH('${sector.replace(/'/g,"\\'")}')" title="${collapsedHSectors[sector] ? 'Alargar' : 'Estreitar'}">❮</button>
              <button class="card-toggle" onclick="toggleCardCollapse('${sector.replace(/'/g,"\\'")}')" title="${collapsedSectors[sector] ? 'Expandir' : 'Minimizar'}">⌄</button>
              <span class="drag-handle" title="Arrastar para reordenar">⠿</span>
            </div>
          </div>
          <div class="card-body">
            <div class="total-row"><span class="num">${total}</span><span class="lbl">demanda${total===1?'':'s'}</span></div>
            <div class="badges">${badges || '<span style="color:var(--muted);font-size:13px;">Sem demandas</span>'}</div>
            ${listHtml}
          </div>
        </div>`;
    }
    html += '</div>';
    mainContent.innerHTML = html;
    setupHomeSortable();
  }

  function setupHomeSortable(){
    const grid = document.getElementById('homeGrid');
    if (!grid || typeof Sortable === 'undefined') return;
    if (window.__homeSortable){ window.__homeSortable.destroy(); }
    window.__homeSortable = Sortable.create(grid, {
      animation: 150,
      handle: '.drag-handle',
      ghostClass: 'sortable-ghost',
      onEnd: function(){
        sectorOrder = Array.from(grid.children).map(el => el.dataset.sector).filter(Boolean);
        saveSectorOrder();
      }
    });
  }

  function toggleCardCollapse(sector){
    collapsedSectors[sector] = !collapsedSectors[sector];
    renderCurrentRoute();
  }
  function toggleCardCollapseH(sector){
    collapsedHSectors[sector] = !collapsedHSectors[sector];
    renderCurrentRoute();
  }

  function itemRowHtml(it, sector){
    const st = styleForStatus(it.status);
    const subParts = [it.associacao, it.etapa].filter(Boolean).join(' · ');
    const mark = getMark(sector, it.processo);
    const marksHtml = (mark.feito || mark.passadoPara) ? `
      <div class="marks-row">
        ${mark.feito ? '<span class="mark-tag mark-done">✓ Feito</span>' : ''}
        ${mark.passadoPara ? `<span class="mark-tag mark-pass">→ ${escapeHtml(mark.passadoPara)}</span>` : ''}
      </div>` : '';
    return `<div class="item ${mark.feito ? 'item-done' : ''}" onclick="openDetail('${it.id}')">
      <div class="procwrap">
        <span class="proc" style="${mark.feito ? 'text-decoration:line-through; text-decoration-thickness:1.5px;' : ''}">${escapeHtml(it.processo)}</span>
        ${subParts ? `<span class="sub">${escapeHtml(subParts)}</span>` : ''}
        ${it.prazo ? `<span class="prazo-tag">Vence: ${escapeHtml(formatPrazoDisplay(it.prazo))}</span>` : ''}
        ${marksHtml}
      </div>
      <span class="st" style="background:${st.bg};color:${st.text}">${escapeHtml(it.status)}</span>
    </div>`;
  }

  function listSectionHtml(title, items, sector){
    if (items.length === 0){
      return `<div class="listwrap">
        <div class="list-title"><span>${escapeHtml(title)}</span><span>0</span></div>
        <div class="empty-sector">Nenhum protocolo aqui.</div>
      </div>`;
    }
    return `<div class="listwrap">
      <div class="list-title"><span>${escapeHtml(title)}</span><span>${items.length}</span></div>
      <div class="list">${items.map(it => itemRowHtml(it, sector)).join('')}</div>
    </div>`;
  }

  function buildEtapaChart(items, sector, activeEtapa){
    const counts = {};
    items.forEach(it => { const k = (it.etapa || '').trim() || 'Sem etapa'; counts[k] = (counts[k]||0)+1; });
    const entries = Object.entries(counts).sort((a,b) => b[1]-a[1]);
    const max = entries.length ? entries[0][1] : 0;
    return `<div class="chart-card">
      <div class="chart-title">Tarefas por etapa &middot; clique para filtrar</div>
      ${entries.length ? entries.map(([label,n]) => `
        <div class="chart-row ${activeEtapa===label?'active':''}" onclick="toggleEtapaFilter('${sector.replace(/'/g,"\\'")}','${label.replace(/'/g,"\\'")}')">
          <div class="chart-label" title="${escapeHtml(label)}">${escapeHtml(label)}</div>
          <div class="chart-bar-wrap"><div class="chart-bar" style="width:${max ? (n/max*100) : 0}%"></div></div>
          <div class="chart-value">${n}</div>
        </div>`).join('') : '<div class="empty-sector">Sem dados para exibir.</div>'}
    </div>`;
  }

  function renderSectorPage(sector){
    const mainContent = document.getElementById('mainContent');
    if (!lastSummary) { mainContent.innerHTML = ''; return; }
    const data = lastSummary.sectors[sector];

    if (!data || data.error === 'not_configured'){
      mainContent.innerHTML = `<div class="empty"><h3>Setor não encontrado</h3><p>Confira se "${escapeHtml(sector)}" existe em <code>SECTOR_SHEETS</code>.</p></div>`;
      return;
    }
    if (data.error === 'fetch_failed'){
      mainContent.innerHTML = `<div class="sector-header"><h2>${escapeHtml(sector)}</h2><div class="err-msg">Não consegui carregar os dados desta aba agora. Vou tentar de novo automaticamente.</div></div>`;
      return;
    }

    const assocItems = data.items.filter(matchesAssoc);
    const statusCounts = {};
    assocItems.forEach(it => { statusCounts[it.status] = (statusCounts[it.status]||0)+1; });
    const total = assocItems.length;
    const sev = worstStyle(statusCounts);
    const sevLabel = worstLabel(statusCounts);
    const activeStatus = sectorStatusFilter[sector] || null;
    const activeEtapa = sectorEtapaFilter[sector] || null;

    const badges = Object.entries(statusCounts).sort((a,b)=>b[1]-a[1]).map(([status,n]) => {
      const st = styleForStatus(status);
      const isActive = activeStatus === status;
      return `<div class="badge ${isActive?'active':''}" style="--b-bg:${st.bg};--b-text:${st.text}" onclick="toggleStatusFilter('${sector.replace(/'/g,"\\'")}','${status.replace(/'/g,"\\'")}')">${escapeHtml(status)} <span class="n">${n}</span></div>`;
    }).join('');

    const displayItems = sortItems(assocItems
      .filter(it => activeStatus ? it.status === activeStatus : true)
      .filter(it => activeEtapa ? ((it.etapa||'').trim() || 'Sem etapa') === activeEtapa : true));

    const activeLabelParts = [activeStatus, activeEtapa].filter(Boolean);
    const hasActiveFilter = activeLabelParts.length > 0;
    const clearBoth = () => { sectorStatusFilter[sector] = null; sectorEtapaFilter[sector] = null; renderCurrentRoute(); };
    window.__clearSectorFilters = clearBoth;

    const filterHeaderHtml = hasActiveFilter
      ? `<div class="list-title" style="margin-bottom:14px;"><span>${escapeHtml(activeLabelParts.join(' + '))}</span><span>${displayItems.length} de ${assocItems.length} &nbsp;·&nbsp; <span class="clear" onclick="window.__clearSectorFilters()">limpar</span></span></div>`
      : '';

    const hasPrazoColumn = assocItems.some(it => it.prazo);
    let listHtml;
    if (assocItems.length === 0){
      listHtml = `<div class="card"><div class="empty-sector">Sem demandas ${assocFilter !== 'all' ? 'para esse filtro' : 'hoje'}.</div></div>`;
    } else if (hasPrazoColumn){
      const today = new Date();
      const todayItems = displayItems.filter(it => isSameDay(parseFlexDate(it.prazo), today));
      const otherItems = displayItems.filter(it => !isSameDay(parseFlexDate(it.prazo), today));
      listHtml = `<div class="card sector-list">
        ${filterHeaderHtml}
        ${listSectionHtml('Tarefas de hoje (prazo hoje)', todayItems, sector)}
        ${listSectionHtml('Tarefas a fazer (outros prazos)', otherItems, sector)}
      </div>`;
    } else {
      const bodyHtml = hasActiveFilter
        ? `<div class="list">${displayItems.map(it => itemRowHtml(it, sector)).join('')}</div>`
        : listSectionHtml('Todos os protocolos', displayItems, sector);
      listHtml = `<div class="card sector-list">
        ${filterHeaderHtml}
        ${bodyHtml}
      </div>`;
    }

    mainContent.innerHTML = `
      <div class="sector-header" style="--sev-solid:${sev.solid}">
        <h2>${escapeHtml(sector)}</h2>
        <div class="total-row" style="margin-bottom:12px;"><span class="num">${total}</span><span class="lbl">demanda${total===1?'':'s'}</span>
          <div class="led" style="margin-left:14px;"><span class="bulb"></span>${sevLabel}</div>
        </div>
        <div class="badges">${badges || '<span style="color:var(--muted);font-size:13px;">Sem demandas</span>'}</div>
      </div>
      <div class="sector-layout">
        <div>${buildEtapaChart(assocItems, sector, activeEtapa)}</div>
        <div>${listHtml}</div>
      </div>`;
  }

  function toggleEtapaFilter(sector, etapa){
    sectorEtapaFilter[sector] = (sectorEtapaFilter[sector] === etapa) ? null : etapa;
    renderCurrentRoute();
  }

  // ---------- envio por WhatsApp ----------
  function etapaBreakdown(items){
    if (items.length === 0) return '';
    const counts = {};
    items.forEach(it => {
      const etapa = (it.etapa||'').trim() || 'Sem etapa';
      const assoc = (it.associacao||'').trim() || 'Sem associação';
      const k = `${etapa} · ${assoc}`;
      counts[k] = (counts[k]||0)+1;
    });
    const parts = Object.entries(counts).sort((a,b) => b[1]-a[1]).map(([k,n]) => `${k}: ${n}`);
    return ` (${parts.join(', ')})`;
  }

  function reportHeaderParts(){
    const now = new Date();
    let weekday = now.toLocaleDateString('pt-BR', {weekday: 'long'});
    weekday = weekday.charAt(0).toUpperCase() + weekday.slice(1);
    const dateStr = now.toLocaleDateString('pt-BR');
    return { weekday, dateStr };
  }
  const procWord = n => n === 1 ? 'processo' : 'processos';

  function buildGeneralReportMessage(){
    const { weekday, dateStr } = reportHeaderParts();
    const lines = [];
    lines.push('*Relatório Diário de Pendências*');
    lines.push(`${weekday} | ${dateStr}`);
    lines.push('');

    let totalAtrasos = 0, totalAlertas = 0;

    Object.keys(SECTOR_SHEETS).forEach(sector => {
      const data = lastSummary.sectors[sector];
      if (!data || data.error) return;
      const items = data.items.filter(matchesAssoc);
      const atrasadosItems = items.filter(it => it.status === 'Expirado' || it.status === 'Crítico');
      const alertaItems = items.filter(it => it.status === 'Alerta');
      totalAtrasos += atrasadosItems.length;
      totalAlertas += alertaItems.length;

      // setores sem atraso e sem alerta não entram no relatório
      if (atrasadosItems.length === 0 && alertaItems.length === 0) return;

      lines.push(`*Setor de ${sector}*`);
      lines.push(`Atrasados: ${atrasadosItems.length} ${procWord(atrasadosItems.length)}${etapaBreakdown(atrasadosItems)}`);
      lines.push(`Em alerta: ${alertaItems.length} ${procWord(alertaItems.length)}`);
      lines.push('');
    });

    lines.push('*Resumo do dia*');
    lines.push(`Total de atrasos: ${totalAtrasos} ${procWord(totalAtrasos)}`);
    lines.push(`Total de processos em alerta: ${totalAlertas} ${procWord(totalAlertas)}`);

    return lines.join('\n');
  }

  function buildSectorReportMessage(sector){
    const { weekday, dateStr } = reportHeaderParts();
    const lines = [];
    lines.push(`*Relatório - Setor de ${sector}*`);
    lines.push(`${weekday} | ${dateStr}`);
    lines.push('');

    const data = lastSummary.sectors[sector];
    if (!data || data.error){
      lines.push('Sem dados no momento.');
      return lines.join('\n');
    }

    const items = data.items.filter(matchesAssoc);
    const atrasadosItems = items.filter(it => it.status === 'Expirado' || it.status === 'Crítico');
    const alertaItems = items.filter(it => it.status === 'Alerta');

    lines.push(`Total de demandas: ${items.length} ${procWord(items.length)}`);
    lines.push(`Atrasados: ${atrasadosItems.length} ${procWord(atrasadosItems.length)}${etapaBreakdown(atrasadosItems)}`);
    lines.push(`Em alerta: ${alertaItems.length} ${procWord(alertaItems.length)}`);
    lines.push('');

    lines.push('*Por etapa (todas as demandas do setor)*');
    const etapaCounts = {};
    items.forEach(it => { const k = (it.etapa||'').trim() || 'Sem etapa'; etapaCounts[k] = (etapaCounts[k]||0)+1; });
    const etapaEntries = Object.entries(etapaCounts).sort((a,b) => b[1]-a[1]);
    if (etapaEntries.length === 0){
      lines.push('Sem demandas no momento.');
    } else {
      etapaEntries.forEach(([k,n]) => lines.push(`${k}: ${n} ${procWord(n)}`));
    }

    return lines.join('\n');
  }

  function buildWhatsAppMessage(){
    if (!lastSummary) return 'Relatório de Demandas: sem dados no momento.';
    const route = parseRoute();
    if (route.type === 'setor') return buildSectorReportMessage(route.sector);
    return buildGeneralReportMessage();
  }

  function openWhatsAppMenu(){
    const validContacts = CONTACTS.filter(c => c.phone && !c.phone.includes('COLE_O_TELEFONE'));
    const route = parseRoute();
    const menuTitle = route.type === 'setor' ? `Relatório do setor: ${route.sector}` : 'Relatório geral (todos os setores)';
    const box = document.getElementById('waBox');
    box.innerHTML = `
      <div class="modal-head">
        <div>
          <div class="proc" style="font-size:16px;">Enviar por WhatsApp</div>
          <div class="sector">${escapeHtml(menuTitle)}</div>
        </div>
        <button class="modal-close" onclick="closeWhatsAppMenu()">&times;</button>
      </div>
      <div class="modal-body">
        ${validContacts.length === 0
          ? `<div class="wa-empty">Nenhum contato cadastrado ainda. Abra o arquivo, procure <code>CONTACTS</code> no início do script e cadastre nome e telefone (com DDI+DDD, só números).</div>`
          : validContacts.map((c,i) => `
            <div class="wa-contact" onclick="sendWhatsApp(${i})">
              <div>
                <div class="wa-name">${escapeHtml(c.name)}</div>
                <div class="wa-phone">${escapeHtml(c.phone)}</div>
              </div>
              <div class="wa-send">➜</div>
            </div>`).join('')}
      </div>`;
    window.__waValidContacts = validContacts;
    document.getElementById('waOverlay').classList.remove('hidden');
  }
  function closeWhatsAppMenu(){
    document.getElementById('waOverlay').classList.add('hidden');
  }
  function sendWhatsApp(i){
    const contact = window.__waValidContacts[i];
    if (!contact) return;
    const text = encodeURIComponent(buildWhatsAppMessage());
    window.open(`https://wa.me/${contact.phone}?text=${text}`, '_blank');
    closeWhatsAppMenu();
  }
  document.getElementById('waBtn').addEventListener('click', openWhatsAppMenu);
  document.getElementById('waOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'waOverlay') closeWhatsAppMenu();
  });

  // ---------- rotas / menu lateral ----------
  function buildSidebarNav(){
    const nav = document.getElementById('sidebarNav');
    nav.innerHTML = `
      <a href="#/painel" data-key="painel"><span class="navdot"></span>Painel das Demandas</a>
      <div class="divider"></div>
      ${Object.keys(SECTOR_SHEETS).map(s => `<a href="#/setor/${encodeURIComponent(s)}" data-key="setor:${escapeHtml(s)}"><span class="navdot"></span>${escapeHtml(s)}</a>`).join('')}
    `;
  }

  function parseRoute(){
    const hash = location.hash || '#/painel';
    const parts = hash.replace(/^#\//,'').split('/');
    if (parts[0] === 'setor' && parts[1]){
      return {type:'setor', sector: decodeURIComponent(parts[1])};
    }
    return {type:'painel'};
  }

  function renderCurrentRoute(){
    const route = parseRoute();
    const activeKey = route.type === 'setor' ? 'setor:'+route.sector : 'painel';
    document.querySelectorAll('#sidebarNav a').forEach(a => {
      a.classList.toggle('active', a.dataset.key === activeKey);
    });
    if (route.type === 'setor') renderSectorPage(route.sector);
    else renderHome();
  }

  window.addEventListener('hashchange', renderCurrentRoute);

  async function refresh(){
    lastSummary = await buildSummary();
    reconcileMarks(lastSummary);
    document.getElementById('updatedAt').textContent = fmtDateTime(lastSummary.updatedAt);
    renderCurrentRoute();
  }

  function isPastToday(hh, mm){
    const now = new Date();
    const target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hh, mm, 0);
    return now >= target;
  }
  function updateChecklist(){
    document.querySelectorAll('#reportChecklist .check-item').forEach(el => {
      const [hh, mm] = el.dataset.target.split(':').map(Number);
      const done = isPastToday(hh, mm);
      el.classList.toggle('done', done);
      el.querySelector('.check-icon').textContent = done ? '✓' : '';
    });
  }

  function tickClock(){
    document.getElementById('clock').textContent = new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
    updateChecklist();
  }

  function openDetail(id){
    const entry = itemsById[id];
    if (!entry) return;
    const {item, sector} = entry;
    const st = styleForStatus(item.status);
    const mark = getMark(sector, item.processo);

    const baseFields = [
      {label: 'Associação', value: item.associacao},
      {label: 'Etapa', value: item.etapa}
    ].concat(item.extra || []).filter(f => f.value !== null && f.value !== undefined && String(f.value).trim() !== '');

    document.getElementById('detailBox').innerHTML = `
      <div class="modal-head">
        <div>
          <div class="proc">${escapeHtml(item.processo)}</div>
          <div class="sector">${escapeHtml(sector)}</div>
        </div>
        <button class="modal-close" onclick="closeDetail()">&times;</button>
      </div>
      <div class="modal-body">
        <span class="modal-status" style="background:${st.bg};color:${st.text}">${escapeHtml(item.status)}</span>
        ${baseFields.map(f => `
          <div class="modal-field">
            <div class="k">${escapeHtml(f.label)}</div>
            <div class="v">${escapeHtml(f.value)}</div>
          </div>`).join('')}
        <div class="track-box">
          <div class="k">Passar demanda para</div>
          <input type="text" class="track-input" id="markPassado" placeholder="Nome da pessoa responsável" value="${escapeHtml(mark.passadoPara)}">
          <button class="track-save" onclick="saveResponsavel('${item.id}')">Salvar responsável</button>
          ${mark.passadoPara ? `<div class="track-note">Responsável atual: <b>${escapeHtml(mark.passadoPara)}</b></div>` : ''}
        </div>
        <div class="track-box">
          <div class="k">Marcar como realizada</div>
          <label class="track-check">
            <input type="checkbox" id="markFeito" ${mark.feito ? 'checked' : ''}>
            Demanda foi feita
          </label>
          <button class="track-save" onclick="saveFeito('${item.id}')">Salvar</button>
          <div class="track-note">As duas marcações ficam salvas neste computador até você lançar o próximo relatório (quando atualizar a planilha).</div>
        </div>
      </div>`;
    document.getElementById('detailOverlay').classList.remove('hidden');
  }
  function saveResponsavel(id){
    const entry = itemsById[id];
    if (!entry) return;
    const passadoPara = document.getElementById('markPassado').value.trim();
    setMark(entry.sector, entry.item.processo, { passadoPara });
    closeDetail();
    renderCurrentRoute();
  }
  function saveFeito(id){
    const entry = itemsById[id];
    if (!entry) return;
    const feito = document.getElementById('markFeito').checked;
    setMark(entry.sector, entry.item.processo, { feito });
    closeDetail();
    renderCurrentRoute();
  }
  function closeDetail(){
    document.getElementById('detailOverlay').classList.add('hidden');
  }
  document.getElementById('detailOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'detailOverlay') closeDetail();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape'){ closeDetail(); closeWhatsAppMenu(); } });

  document.getElementById('assocSeg').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    assocFilter = btn.dataset.v;
    document.querySelectorAll('#assocSeg button').forEach(b => b.classList.toggle('active', b === btn));
    renderCurrentRoute();
  });

  const sidebarEl = document.getElementById('sidebar');
  const sidebarToggleBtn = document.getElementById('sidebarToggle');
  const sidebarOpenBtn = document.getElementById('sidebarOpenBtn');
  sidebarToggleBtn.addEventListener('click', () => {
    sidebarEl.classList.add('collapsed');
    sidebarOpenBtn.classList.add('show');
  });
  sidebarOpenBtn.addEventListener('click', () => {
    sidebarEl.classList.remove('collapsed');
    sidebarOpenBtn.classList.remove('show');
  });

  buildSidebarNav();
  loadMarks();
  loadSectorOrder();
  tickClock();
  setInterval(tickClock, 1000);
  refresh();
  setInterval(refresh, POLL_MS);
  </script>
</body>
</html>
